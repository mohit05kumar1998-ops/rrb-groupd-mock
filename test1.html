<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRB Group D CBT Exam</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Top Navigation Header */
        header { background: #337ab7; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Section Tabs Header (TCS iON Style) */
        .section-header { background: #e0e0e0; padding: 8px 15px; border-bottom: 2px solid #ccc; display: flex; gap: 8px; flex-wrap: wrap; }
        .section-btn { background: #fff; border: 1px solid #b6b6b6; padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: bold; border-radius: 3px 3px 0 0; }
        .section-btn.active { background: #337ab7; color: white; border-color: #337ab7; }

        /* Main Exam Body */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .question-area { flex: 1; padding: 20px; background: white; overflow-y: auto; white-space: pre-line; }
        .palette-area { width: 300px; background: #eef2f5; border-left: 1px solid #ccc; padding: 15px; display: flex; flex-direction: column; }
        
        /* Question Palette Grid */
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; max-height: 80vh; overflow-y: auto; }
        .p-btn { padding: 8px; border: 1px solid #999; background: #fff; text-align: center; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .p-btn.active { border: 2px solid #000; font-weight: bold; }
        .p-btn.answered { background: #5cb85c; color: white; border-color: #4cae4c; }
        .p-btn.review { background: #8a6d3b; color: white; }

        /* Question Content */
        .q-title { font-size: 15px; margin-bottom: 15px; font-weight: bold; line-height: 1.5; }
        .option-item { margin-bottom: 10px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        /* Footer Controls */
        footer { background: #f5f5f5; padding: 10px 20px; border-top: 1px solid #ccc; display: flex; justify-content: space-between; }
        .btn { padding: 8px 16px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .btn-primary { background: #337ab7; color: white; }
        .btn-warning { background: #f0ad4e; color: white; }
    </style>
</head>
<body>

    <header>
        <div><strong>RRB Group D CBT Test - 01</strong></div>
        <div>Time Left: <span id="timer">90:00</span></div>
    </header>

    <!-- SECTION SWITCH TABS -->
    <div class="section-header" id="section-tabs"></div>

    <div class="main-container">
        <!-- Question Display Box -->
        <div class="question-area">
            <div class="q-title" id="question-text">Loading question...</div>
            <div id="options-container"></div>
        </div>

        <!-- Question Palette (Right Side) -->
        <div class="palette-area">
            <h4>Question Palette</h4>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>

    <!-- Action Buttons -->
    <footer>
        <div>
            <button class="btn btn-warning" onclick="markForReview()">Mark for Review</button>
            <button class="btn" onclick="clearResponse()">Clear Response</button>
        </div>
        <div>
            <button class="btn btn-primary" onclick="saveAndNext()">Save & Next</button>
        </div>
    </footer>

    <script>
        const examData = [
            {
                sectionName: "General Science",
                questions: [
                    { id: 1, text: "Q.1 एक पिंड को ऊँचाई से गिराया जाता है। यदि यह 3.0 s तक गिरता है और g = 10 m/s² है, तो इसका अंतिम वेग (v) कितना होगा?", options: ["30 m/s", "20 m/s", "10 m/s", "40 m/s"], correct: 0 },
                    { id: 2, text: "Q.2 साबुन की मार्जन क्रिया में मिसेल (micelles) की मुख्य भूमिका क्या है?", options: ["जल की कठोरता कम करना", "जल से फेन उत्पन्न करना", "जल के पृष्ठ तनाव में वृद्धि करना", "कपड़ों से तेल और गंदगी को ट्रैप करना और हटाना"], correct: 3 },
                    { id: 3, text: "Q.3 लेंस की शक्ति को ______ के रूप में परिभाषित किया जाता है।", options: ["इसकी फोकस दूरी के वर्ग", "मीटर में इसकी फोकस दूरी के व्युत्क्रम", "इसकी फोकस दूरी और अपवर्तनांक के गुणनफल", "छवि दूरी और वस्तु दूरी के अनुपात"], correct: 1 },
                    { id: 4, text: "Q.4 निम्नलिखित कथनों में से कौन-सा सही है?", options: ["किया गया कार्य केवल धनात्मक ही हो सकता है।", "किया गया कार्य केवल ऋणात्मक ही हो सकता है।", "किया गया कार्य बल की दिशा के आधार पर धनात्मक या ऋणात्मक हो सकता है।", "किया गया कार्य बल या विस्थापन पर निर्भर नहीं करता है।"], correct: 2 },
                    { id: 5, text: "Q.5 निम्नलिखित में से किसका उपयोग विलयन की सांद्रता को व्यक्त करने के लिए नहीं किया जाता है?", options: ["विलयन का द्रव्यमान आयतन प्रतिशत", "किसी विलयन का द्रव्यमान द्रव्यमान प्रतिशत", "विलयन का आयतन-द्रव्यमान प्रतिशत", "विलयन का आयतन-आयतन प्रतिशत"], correct: 2 },
                    { id: 6, text: "Q.6 अस्थमा मुख्यतः श्वसन तंत्र के किस भाग को प्रभावित करता है?", options: ["श्वासनली (Trachea)", "डायाफ्राम (Diaphragm)", "ब्रॉन्की और ब्रॉन्किओल्स (Bronchi and bronchioles)", "एल्वियोली (Alveoli)"], correct: 2 },
                    { id: 7, text: "Q.7 निम्नलिखित में से कौन-सी धातु, सक्रियता श्रेणी के मध्य में निष्कर्षित की जाती है?", options: ["सोडियम", "पोटैशियम", "सोना", "लोहा"], correct: 3 },
                    { id: 8, text: "Q.8 जब मुद्रित सामग्री पर एक मोटी कांच की पट्टी रखी जाती है, तो अक्षर उभरे हुए दिखाई देते हैं। ऐसा ______ के कारण होता है।", options: ["प्रकाश के अपवर्तन", "प्रकाश के ध्रुवीकरण", "पूर्ण आंतरिक परावर्तन", "प्रकाश के प्रकीर्णन"], correct: 0 },
                    { id: 9, text: "Q.9 जब जल और पोषक तत्व उपलब्ध होते हैं, तो शैवाल ______ प्रक्रिया द्वारा तेजी से वृद्धि करते हैं और गुणित होते हैं।", options: ["मुकुलन (budding)", "खंडीभवन (fragmentation)", "परागण (pollination)", "बीजाणु निर्माण (spore formation)"], correct: 1 },
                    { id: 10, text: "Q.10 क्या होता है जब जिंक की छड़ को जलीय कॉपर सल्फेट विलयन में रखा जाता है?", options: ["कोई रासायनिक परिवर्तन नहीं देखा गया।", "कॉपर सल्फेट विलयन का नीला रंग फीका पड़ जाता है।", "विलयन का तापमान गिर जाता है।", "अभिक्रिया प्रारंभ करने के लिए ऊष्मा की आवश्यकता होती है।"], correct: 1 },
                    { id: 11, text: "Q.11 निम्नलिखित में से कौन-सा कथन सही है?\nकथन 1: विभवांतर को वोल्ट में मापा जाता है।\nकथन 2: एक वोल्ट एक न्यूटन प्रति कूलॉम के बराबर है।", options: ["कथन 1 और 2 दोनों गलत हैं।", "केवल कथन 1 सही है।", "केवल कथन 2 सही है।", "कथन 1 और 2 दोनों सही हैं।"], correct: 1 },
                    { id: 12, text: "Q.12 वह कौन-से पोल्ट्रि पक्षी हैं जिन्हे अंडे उत्पादन के लिए पाला जाता है?", options: ["कॉमन कार्प (Common carp)", "मिल्च (Milch)", "लेयर (Layers)", "ब्रॉयलर (broilers)"], correct: 2 },
                    { id: 13, text: "Q.13 कोशिका विभाजन की किस विधि द्वारा द्विगुणित गुणसूत्रों को अगुणित युग्मकों में विभाजित किया जाता है?", options: ["द्वि-खंडन (Binary Fission)", "असूत्रीविभाजन (Amitosis)", "सूत्रीविभाजन (Mitosis)", "अर्धसूत्री विभाजन (Meiosis)"], correct: 3 },
                    { id: 14, text: "Q.14 एक ध्वनि तरंग की आवृत्ति 50 Hz है। एक तरंग पूरी होने में इसे कितना समय लगेगा?", options: ["0.2 s", "50 s", "5 s", "0.02 s"], correct: 3 },
                    { id: 15, text: "Q.15 निम्नलिखित में से कौन-सी जीवन प्रक्रिया, प्रजातियों में विविधता लाने के लिए महत्वपूर्ण है?", options: ["लैंगिक जनन (Sexual reproduction)", "स्वपोषी पोषण (Autotrophic nutrition)", "विषमपोषी पोषण (Heterotrophic nutrition)", "परिवहन (Transportation)"], correct: 0 },
                    { id: 16, text: "Q.16 वह प्रकार्यात्मक समूह जिसमें ऑक्सीजन विषम परमाणु (oxygen hetero atom) नहीं होता है, ______ है।", options: ["हेलो ऐल्केन (halo alkane)", "कार्बोक्सिलिक अम्ल (carboxylic acid)", "कीटोन (ketone)", "ऐल्कोहॉल (alcohol)"], correct: 0 },
                    { id: 17, text: "Q.17 निम्नलिखित में से कौन-सा कथन स्थिर अनुपात के नियम का सर्वोत्तम रूप से वर्णन करता है?", options: ["किसी यौगिक में तत्व सदैव यादृच्छिक अनुपात में पाए जाते हैं।", "किसी अभिक्रिया के दौरान परमाणुओं को लघु कणों में विभाजित किया जा सकता है।", "रासायनिक अभिक्रिया में द्रव्यमान का न तो निर्माण हो सकता है और न ही विनाश।", "किसी रासायनिक यौगिक में समान तत्व सदैव द्रव्यमान के समान अनुपात में होते हैं।"], correct: 3 },
                    { id: 18, text: "Q.18 निम्नलिखित में से कौन-सा, एकसमान वृत्तीय गति का एक उदाहरण प्रस्तुत करता है?", options: ["अपने मार्ग पर त्वरित होती एक कार", "नियत चाल से घूर्णन करती पंखे की ब्लेड", "ऊर्ध्वाधर ऊपर की ओर फेंकी गई गेंद", "अपनी पटरी पर गतिमान एक ट्रेन"], correct: 1 },
                    { id: 19, text: "Q.19 निम्नलिखित में से कौन-सा पादप ऊतक प्रकाश संश्लेषण करता है?", options: ["दृढ़ोतक (Sclerenchyma)", "जाइलम (Xylem)", "हरित ऊत्तक (Chlorenchyma)", "पोषवाह (Phloem)"], correct: 2 },
                    { id: 20, text: "Q.20 एक कुंडली का प्रतिरोध 44 Ω है। यदि इसे 220 V की आपूर्ति से जोड़ा जाए, तो कुंडली द्वारा खपत की गई शक्ति कितनी है?", options: ["0.2 W", "1100 W", "110 W", "5 W"], correct: 1 },
                    { id: 21, text: "Q.21 पृथ्वी की परिक्रमा एक वृत्तीय पथ पर नियत गति से करने वाले उपग्रह की गति एकसमान वृत्तीय गति का एक उत्कृष्ट उदाहरण है। इस गति का कौन-सा गुण इसके त्वरण को शून्य होने से रोकता है?", options: ["कक्षीय गतिकी के कारण वस्तु का द्रव्यमान निरंतर बदलता रहता है।", "कुल यांत्रिक ऊर्जा संरक्षित रहती है, जिससे त्वरण आवश्यक हो जाता है।", "गुरुत्वाकर्षण बल के लिए गति इतनी अधिक है कि वह स्थिर वेग बनाए नहीं रख सकता।", "गति की दिशा प्रत्येक बिंदु पर निरंतर बदलती रहती है, अर्थात वेग परिवर्तित हो रहा है।"], correct: 3 },
                    { id: 22, text: "Q.22 क्या होता है जब एक नैफ्थलीन बॉल को खुली जगह में धातु की प्लेट में जला दिया जाता है?", options: ["यह धातु की प्लेट पर बिना किसी निक्षेप के पीली ज्वाला के साथ जलता है।", "यह धातु की प्लेट पर काले कज्जली निक्षेप के साथ नीली ज्वाला के साथ जलता है।", "यह नीली ज्वाला के साथ जलता है।", "यह धातु की प्लेट पर काले कज्जली निक्षेप के साथ पीली ज्वाला के साथ जलता है।"], correct: 3 },
                    { id: 23, text: "Q.23 प्रजनन के दौरान, DNA प्रतिकृति बनाना क्यों महत्वपूर्ण है?", options: ["श्वसन के लिए", "पाचन के लिए", "रूधिर परिसंचरण के लिए", "लक्षणों की वंशागति के लिए"], correct: 3 },
                    { id: 24, text: "Q.24 निम्नलिखित में से कौन-सा विकल्प, मछली संवर्धन (Culture Fishery) शब्द का सर्वोत्तम रूप से वर्णन करता है?", options: ["कृत्रिम संसाधनों से मछलियां पकड़ना", "समुद्री जल से मछलियां पकड़ना", "मछलियों का पालन", "प्राकृतिक संसाधनों से मछलियां पकड़ना"], correct: 2 },
                    { id: 25, text: "Q.25 क्लोरीन का आंशिक परमाणु द्रव्यमान (fractional atomic mass) निम्नलिखित में से किसके कारण होता है?", options: ["इसकी यौगिक प्रकृति", "प्रायोगिक त्रुटि", "आयनों की उपस्थिति", "समस्थानिकों की उपस्थिति"], correct: 3 }
                ]
            },
            {
                sectionName: "Mathematics",
                questions: [
                    { id: 26, text: "Q.26 तीन पाइप, A, B और C, एक खाली टैंक को क्रमशः 40 मिनट, 20 मिनट और 30 मिनट में पूरा भर सकते हैं। जब टैंक खाली होता है, तो तीनों पाइप खोल दिए जाते हैं। A, B और C क्रमशः रासायनिक विलयन P, Q और R डिस्चार्ज करते हैं। 9 मिनट के बाद टैंक के द्रव में विलयन Q का अनुपात कितना है?", options: ["3/13", "6/13", "3/4", "7/13"], correct: 1 },
                    { id: 27, text: "Q.27 सोनिया की शादी 15 वर्ष पहले हुई थी। उसकी वर्तमान आयु उसकी शादी के समय की आयु का 8/5 गुना है। उसकी शादी के समय उसकी बहन उससे 8 वर्ष छोटी थी। उसकी बहन की वर्तमान आयु ज्ञात कीजिए।", options: ["40 वर्ष", "32 वर्ष", "24 वर्ष", "28 वर्ष"], correct: 1 },
                    { id: 28, text: "Q.28 यदि p = 6, q = -3 (3/6), तो p³ - 3p² + 3p + 3q + 3q² + q³ का मान ज्ञात कीजिए।", options: ["61", "-61", "-117", "117"], correct: 3 },
                    { id: 29, text: "Q.29 यदि tan θ = 12/5, तो sec θ का मान ज्ञात कीजिए।", options: ["13/12", "5/13", "12/5", "13/5"], correct: 3 },
                    { id: 30, text: "Q.30 1/20, 10/40 का कितना प्रतिशत है?", options: ["40%", "20%", "30%", "35%"], correct: 1 },
                    { id: 31, text: "Q.31 एक कक्षा के 26 छात्रों की औसत आयु 26 वर्ष है। यदि शिक्षक की आयु भी शामिल कर ली जाए, तो पूरे समूह की औसत आयु 27 वर्ष हो जाती है। शिक्षक की आयु (वर्ष में) ज्ञात कीजिए।", options: ["53", "50", "57", "54"], correct: 0 },
                    { id: 32, text: "Q.32 325 m लंबी एक रेलगाड़ी 5 km/hr की चाल से समान दिशा में चल रहे एक व्यक्ति को 45 सेकंड में पार कर जाती है। इस रेलगाड़ी को विपरीत दिशा में 20 km/hr की चाल से चल रही 440 m लंबी एक अन्य रेलगाड़ी को पूरी तरह से पार करने में कितना समय (सेकंड में) लगेगा?", options: ["54", "40", "51", "52"], correct: 0 },
                    { id: 33, text: "Q.33 स्मृति 21 km/hr की चाल से एक शॉपिंग मॉल जाती है और 59 km/hr की चाल से वापस आती है। पूरी यात्रा के लिए उसकी औसत चाल (km/hr में) ज्ञात कीजिए।", options: ["30.3", "40.2", "23.4", "32.2"], correct: 3 },
                    { id: 34, text: "Q.34 निम्नलिखित में से कौन-सा अनुपात, 3 : 2 के तुल्य है?", options: ["53 : 38", "51 : 37", "54 : 36", "52 : 34"], correct: 2 },

                    { id: 45, text: "Q.45 एक बर्तन का 2/5 भाग नीले द्रव से भरा है, शेष बर्तन का एक-तिहाई भाग काले द्रव से भरा है, शेष बर्तन का 5/6 भाग पीले द्रव से भरा है तथा शेष 4.2 लीटर सफेद द्रव है। बर्तन की कुल धारिता ज्ञात कीजिए।", options: ["60 लीटर", "78 लीटर", "63 लीटर", "72 लीटर"], correct: 2 },

                    { id: 92, text: "Q.92 मई 2025 में केंद्रीय सामाजिक न्याय एवं अधिकारिता मंत्रालय द्वारा 'सम्मान के साथ वृद्धावस्था (Ageing with Dignity)' कार्यक्रम के दौरान निम्नलिखित में से कौन-सी नई डिजिटल सुविधा का शुभारंभ किया गया?", options: ["वरिष्ठ नागरिक सेवाओं के लिए वन-स्टॉप पोर्टल", "वरिष्ठ नागरिकों के लिए रोज़गार कार्यालय पोर्टल", "डिजिटल जीवन प्रमाणपत्र प्लेटफ़ॉर्म", "वरिष्ठ नागरिक कल्याण पोर्टल"], correct: 3 },
                    { id: 93, text: "Q.93 भारतीय रिजर्व बैंक (RBI) ने जून 2025 में जनता को अपने कार्यों के बारे में समझाने के लिए निम्नलिखित में से कौन-सी डॉक्यूमेंट्री लॉन्च की?", options: ["फाइनेंसियल लिटरेसी A2Z", "RBI: मनी सिम्प्लीफाइड", "माय RBI स्टोरी", "RBI अनलॉक्ड: बियॉन्ड द रुपी"], correct: 3 },

                    { id: 98, text: "Q.98 अप्रैल 2025 में, इंडियाएआई मिशन (IndiaAI Mission) के तहत भारत का पहला सॉवरेन इंडिक एलएलएम (sovereign Indic LLM) बनाने के लिए किस स्टार्टअप का चयन किया गया था?", options: ["सर्वम AI (Sarvam AI)", "AI4 भारत (AI4 Bharat)", "पीपल+AI (People+AI)", "वाधवानी AI (Wadhwani AI)"], correct: 0 },

                    { id: 100, text: "Q.100 16 मई 2025 को, सर्वोच्च न्यायालय ने भारत सरकार द्वारा किन वर्षों में पारित पूर्वव्यापी पर्यावरणीय मंजूरी के आदेशों को अमान्य कर दिया?", options: ["2006 और 2011", "2009 और 2015", "2017 और 2021", "2012 और 2014"], correct: 2 }
                ]
            }
        ];

        let currentSectionIndex = 0;
        let currentQuestionIndex = 0;
        let userAnswers = {}; 
        let reviewStatus = {}; 

        function renderSectionTabs() {
            const container = document.getElementById("section-tabs");
            container.innerHTML = "";
            examData.forEach((sec, idx) => {
                const btn = document.createElement("button");
                btn.className = `section-btn ${idx === currentSectionIndex ? 'active' : ''}`;
                btn.innerText = sec.sectionName;
                btn.onclick = () => switchSection(idx);
                container.appendChild(btn);
            });
        }

        function switchSection(index) {
            currentSectionIndex = index;
            currentQuestionIndex = 0;
            renderSectionTabs();
            loadQuestion();
            renderPalette();
        }

        function loadQuestion() {
            const currentQ = examData[currentSectionIndex].questions[currentQuestionIndex];
            document.getElementById("question-text").innerText = currentQ.text;
            
            const optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";

            const key = `${currentSectionIndex}-${currentQuestionIndex}`;
            const selectedOpt = userAnswers[key];

            currentQ.options.forEach((opt, idx) => {
                const label = document.createElement("label");
                label.className = "option-item";
                label.innerHTML = `
                    <input type="radio" name="opt" value="${idx}" ${selectedOpt === idx ? 'checked' : ''}>
                    ${opt}
                `;
                optContainer.appendChild(label);
            });
        }

        function renderPalette() {
            const palette = document.getElementById("palette-grid");
            palette.innerHTML = "";
            const totalQ = examData[currentSectionIndex].questions.length;

            for(let i = 0; i < totalQ; i++) {
                const btn = document.createElement("div");
                const key = `${currentSectionIndex}-${i}`;
                
                let btnClass = "p-btn";
                if(i === currentQuestionIndex) btnClass += " active";
                if(userAnswers[key] !== undefined) btnClass += " answered";
                if(reviewStatus[key]) btnClass += " review";

                btn.className = btnClass;
                btn.innerText = i + 1;
                btn.onclick = () => { currentQuestionIndex = i; loadQuestion(); renderPalette(); };
                palette.appendChild(btn);
            }
        }

        function saveAndNext() {
            const selected = document.querySelector('input[name="opt"]:checked');
            const key = `${currentSectionIndex}-${currentQuestionIndex}`;
            
            if(selected) {
                userAnswers[key] = parseInt(selected.value);
            }
            
            if(currentQuestionIndex < examData[currentSectionIndex].questions.length - 1) {
                currentQuestionIndex++;
            }
            loadQuestion();
            renderPalette();
        }

        function clearResponse() {
            const key = `${currentSectionIndex}-${currentQuestionIndex}`;
            delete userAnswers[key];
            delete reviewStatus[key];
            loadQuestion();
            renderPalette();
        }

        function markForReview() {
            const key = `${currentSectionIndex}-${currentQuestionIndex}`;
            reviewStatus[key] = true;
            saveAndNext();
        }

        renderSectionTabs();
        loadQuestion();
        renderPalette();
    </script>
