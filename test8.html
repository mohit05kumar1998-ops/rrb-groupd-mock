<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RRB Group D CBT Exam Portal (Subject Wise - 100 Questions)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; }
        body { background-color: #f0f0f0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Header */
        header { background: #337ab7; color: white; padding: 10px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Candidate Info Bar */
        .sub-header { background: #e8e8e8; padding: 8px 20px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .candidate-info { display: flex; align-items: center; gap: 15px; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .timer-box { background: #d9534f; color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold; font-size: 16px; }

        /* Subject Navigation Tabs */
        .subject-tabs { background: #fff; border-bottom: 2px solid #337ab7; display: flex; gap: 2px; padding-left: 10px; overflow-x: auto; }
        .tab-btn { background: #e0e0e0; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; font-size: 13px; color: #333; border-radius: 5px 5px 0 0; white-space: nowrap; }
        .tab-btn.active { background: #337ab7; color: white; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Section: Question Area */
        .question-area { width: 75%; background: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #ccc; overflow-y: auto; }
        .q-header { border-bottom: 2px solid #337ab7; padding-bottom: 8px; margin-bottom: 15px; font-weight: bold; color: #337ab7; display: flex; justify-content: space-between; }
        .q-text { font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #222; white-space: pre-line; }
        
        /* Options Selection Styling */
        .options-container label { 
            display: flex; 
            align-items: center;
            margin-bottom: 12px; 
            padding: 12px 15px; 
            background: #f9f9f9; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .options-container label:hover { background: #eef5fc; border-color: #337ab7; }
        .options-container input[type="radio"] { margin-right: 12px; transform: scale(1.2); }

        /* Active Selected Option Color */
        .options-container label.selected-option,
        .options-container label:has(input[type="radio"]:checked) {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
            color: #0f5132 !important;
            font-weight: bold;
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .question-area { width: 100%; border-right: none; }
            .palette-area { width: 100%; }
        }

        /* Bottom Controls */
        .action-bar { border-top: 1px solid #ddd; padding-top: 15px; display: flex; justify-content: space-between; background: white; flex-wrap: wrap; gap: 10px; }
        .btn-group-left, .btn-group-right { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 13px; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        .btn-save { background: #5cb85c; color: white; }
        .btn-clear { background: #f0ad4e; color: white; }
        .btn-review { background: #8e44ad; color: white; } /* Purple */
        .btn-submit { background: #d9534f; color: white; }

        /* Right Section: Palette */
        .palette-area { width: 25%; background: #f4f6f9; padding: 15px; display: flex; flex-direction: column; }
        .palette-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .badge { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: white; border-radius: 3px; font-weight: bold; }
        
        /* TCS PALETTE STATUS COLOR CODES */
        .status-answered, button.q-btn.status-answered { background-color: #5cb85c !important; color: white !important; border-color: #4cae4c !important; }
        .status-not-answered, button.q-btn.status-not-answered { background-color: #d9534f !important; color: white !important; border-color: #d43f3a !important; }
        .status-review, button.q-btn.status-review { background-color: #8e44ad !important; color: white !important; border-color: #732d91 !important; } /* PURPLE */
        .status-not-visited, button.q-btn.status-not-visited { background-color: #fff !important; color: #333 !important; border: 1px solid #ccc !important; }

        .q-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 350px; overflow-y: auto; }
        .q-btn { width: 38px; height: 38px; border: 1px solid #ccc; background: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .q-btn.active { outline: 3px solid #337ab7; outline-offset: -1px; }
    </style>
</head>
<body>

    <header>
        <div>RRB Group D Online CBT Examination</div>
    </header>

    <div class="sub-header">
        <div class="candidate-info">
            <div class="user-img">User</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;">Candidate Name: Roll No. 102938</div>
                <div style="font-size: 12px; color: #555;">Subject: Full Length Mock Test</div>
            </div>
        </div>
        <div class="timer-box">Time Left: <span id="timer-display">90:00</span></div>
    </div>

    <!-- Subject Tabs -->
    <div class="subject-tabs">
        <button class="tab-btn active" onclick="switchSubject('science', event)">General Science</button>
        <button class="tab-btn" onclick="switchSubject('maths', event)">Mathematics</button>
        <button class="tab-btn" onclick="switchSubject('reasoning', event)">Reasoning</button>
        <button class="tab-btn" onclick="switchSubject('ga', event)">General Awareness</button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        
        <div class="question-area">
            <div>
                <div class="q-header">
                    <span id="question-number">Question No. 1</span>
                    <span id="subject-title" style="font-size: 13px; color: #666;">General Science</span>
                </div>
                <div class="q-text" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
            </div>

            <div class="action-bar">
                <div class="btn-group-left">
                    <button class="btn btn-clear" onclick="clearOption()">Clear Response</button>
                    <button class="btn btn-review" onclick="markForReview()">Mark for Review & Next</button>
                </div>
                <div class="btn-group-right">
                    <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
                    <button class="btn btn-submit" onclick="submitTest()">Submit Test</button>
                </div>
            </div>
        </div>

        <div class="palette-area">
            <div class="palette-legend">
                <div class="legend-item"><span class="badge status-answered" id="count-answered">0</span> Answered</div>
                <div class="legend-item"><span class="badge status-not-answered" id="count-not-answered">0</span> Not Answered</div>
                <div class="legend-item"><span class="badge status-not-visited" id="count-not-visited">0</span> Not Visited</div>
                <div class="legend-item"><span class="badge status-review" id="count-review">0</span> Marked for Review</div>
            </div>

            <div style="font-weight: bold; font-size: 13px; margin-bottom: 10px;">Question Palette:</div>
            <div class="q-grid" id="question-palette"></div>
        </div>

    </div>

    <script>
        const examData = {
            science: {
                name: "General Science",
                questions: [
                    { id: 1, text: "Q.1 निम्नलिखित में से कौन-सा, काँच के प्रिज्म द्वारा श्वेत प्रकाश के विक्षेपण के लिए उत्तरदायी है?", options: ["श्वेत प्रकाश में केवल एक ही रंग होता है।", "काँच में विभिन्न रंगों के प्रकाश, भिन्न-भिन्न चालों से गमन करते हैं।", "प्रिज्म कुछ रंगों को अवशोषित कर लेता है।", "काँच में विभिन्न रंगों के प्रकाश, समान चाल से गमन करते हैं।"], correct: 1 },
                    { id: 2, text: "Q.2 किसी विलयन को स्थायी तब कहा जाता है जब", options: ["अविक्षुब्ध रहने पर विलेय के कण नीचे बैठ जाते हैं", "अविक्षुब्ध रहने पर विलेय के कण विलयन की सतह पर तैरते हैं", "अविक्षुब्ध रहने पर भी विलेय के कण नीचे नहीं बैठते हैं", "विलेय के कण विलायक कणों के साथ एक अलग परत बनाते हैं"], correct: 2 },
                    { id: 3, text: "Q.3 निम्नलिखित में से कौन-सा विकल्प, उदासीनीकरण अभिक्रिया को सर्वोत्तम रूप से वर्णित करता है?", options: ["क्षार + ऑक्साइड -> लवण + जल", "अम्ल + धातु -> लवण + हाइड्रोजन", "अम्ल + क्षार -> लवण + जल", "अम्ल + लवण -> जल"], correct: 2 },
                    { id: 4, text: "Q.4 मनुष्यों में वृक्कों का यथार्थ स्थान क्या है?", options: ["उदर में, मेरूदंड के दोनों ओर", "वक्ष क्षेत्र में, हृदय के ठीक नीचे", "वक्ष क्षेत्र में, फुफ्फुस के दोनों ओर", "उदर में, आंत के दोनों ओर"], correct: 0 },
                    { id: 5, text: "Q.5 जीवों की आबादी में विविधता मुख्यतः क्यों महत्वपूर्ण है?", options: ["यह सुनिश्चित करता है कि सभी जीव समान हों", "यह बदलती पर्यावरणीय परिस्थितियों में जीवित रहने की संभावना को बढ़ाता है", "यह जीवों को तेजी से प्रजनन करने में मदद करता है", "यह सदैव एक ही पीढ़ी में तुरन्त परिणाम देता है।"], correct: 1 },
                    { id: 6, text: "Q.6 फ्लेमिंग के बाएं हाथ के नियम का उपयोग विद्युत मोटर में गति की दिशा निर्धारित करने के लिए किया जाता है। कौन सी उंगली बल या गति की दिशा दर्शाती है?", options: ["अँगूठा (Thumb)", "कनिष्ठिका (Little finger)", "मध्यांगुलि (Middle finger)", "तर्जनी (Index finger)"], correct: 0 },
                    { id: 7, text: "Q.7 20 Ω प्रतिरोध का एक विद्युत हीटर 220V आपूर्ति से जुड़ने पर 10 मिनट तक प्रचालित होता है। उत्पन्न ऊष्मा _____ है।", options: ["2.9 × 10⁴ J", "2.9 × 10⁵ J", "1.45 × 10⁵ J", "1.45 × 10⁶ J"], correct: 3 },
                    { id: 8, text: "Q.8 वैद्‌युत अपघटनी परिष्करण के दौरान एनोड के रूप में किसको प्रयुक्त किया जाता है?", options: ["एक अक्रिय इलेक्ट्रोड", "ग्रेफाइट की एक छड़", "अशुद्ध धातु की एक पट्टी जिसे परिष्कृत किया जाना है", "शुद्ध धातु की एक पट्टी जिसे परिष्कृत किया जाना है"], correct: 2 },
                    { id: 9, text: "Q.9 निम्नलिखित में से कौन-सा, स्थिर अनुपात के नियम के अनुसार है?\na. जल में, हाइड्रोजन के द्रव्यमान और ऑक्सीजन के द्रव्यमान का अनुपात हमेशा 1 : 8 होता है।\nb. कार्बन डाइऑक्साइड में कार्बन और ऑक्सीजन का अनुपात हमेशा द्रव्यमान के अनुसार 3 : 8 होता है।\nc. अमोनिया में, नाइट्रोजन और हाइड्रोजन हमेशा द्रव्यमान के अनुसार 14 : 1 के अनुपात में विद्यमान होते हैं।", options: ["केवल a और b", "a, b और c", "केवल b और c", "केवल a"], correct: 0 },
                    { id: 10, text: "Q.10 निम्नलिखित में से किस कण की उपस्थिति के कारण रूक्ष अंतर्द्रव्यी जालिका (Rough Endoplasmic Reticulum - RER) सूक्ष्मदर्शी से देखने पर रूक्ष दिखाई देती है?", options: ["लयनकाय (Lysosome)", "तारककाय (Centrosome)", "राइबोसोम (Ribosome)", "पेरॉक्सीकाय (Peroxisome)"], correct: 2 },
                    { id: 11, text: "Q.11 जब किसी हाइड्रोकार्बन को वायु की अधिकता में जलाया जाता है, तो अंतिम उत्पाद सदैव _____ बनता है।", options: ["कार्बन डाइऑक्साइड और जल", "कार्बन डाइऑक्साइड और हाइड्रोजन", "कार्बन मोनोऑक्साइड और हाइड्रोजन", "कार्बन मोनोऑक्साइड और जल"], correct: 0 },
                    { id: 12, text: "Q.12 एक मृदु ध्वनि की तुलना में, समान आवृत्ति की एक तेज ध्वनि तरंग की क्या विशेषता होती है?", options: ["अधिक आयाम", "उच्च तारत्व", "छोटी तरंगदैर्ध्य", "कम चाल"], correct: 0 },
                    { id: 13, text: "Q.13 एक व्यक्ति बस में खड़ा है और अचानक बस रुक जाती है। वह व्यक्ति आगे की ओर गिरने लगता है। गति के निम्नलिखित नियमों में से कौन सा नियम इस घटना के लिए सीधे तौर पर ज़िम्मेदार है?", options: ["न्यूटन का गति का पहला नियम।", "न्यूटन का गति का दूसरा नियम।", "संवेग संरक्षण का नियम।", "न्यूटन का गति का तीसरा नियम।"], correct: 0 },
                    { id: 14, text: "Q.14 निम्नलिखित में से क्या, नर मानव जनन तंत्र का हिस्सा है?", options: ["डिंबवाहिनी नली", "गर्भाशय", "योनि", "पुरःस्थ ग्रंथि"], correct: 3 },
                    { id: 15, text: "Q.15 निम्नलिखित में से कौन-सा, एक ही भूमि पर निश्चित पैटर्न में दो या दो से अधिक फसलों को एक साथ उगाए जाने का उदाहरण है?", options: ["एकसस्यन (Monocropping)", "वायव संवर्धन (Aeroponics)", "जल संवर्धन (Hydroponics)", "अन्तर-सस्यन (Inter-cropping)"], correct: 3 },
                    { id: 16, text: "Q.16 प्रकीर्णन के कारण स्क्रीन पर प्राप्त सात रंगों के बैंड को _____ कहा जाता है।", options: ["परावर्तन प्रतिरूप (Reflection pattern)", "प्रतिछाया (Shadow)", "प्रतिबिंब (Image)", "स्पेक्ट्रम (Spectrum)"], correct: 3 },
                    { id: 17, text: "Q.17 निम्नलिखित में से कौन-सा कथन, सूत्र इकाई को परिभाषित करता है?", options: ["एक परमाणु का द्रव्यमान", "किसी आयनिक यौगिक की सूत्र इकाई में सभी परमाणुओं के परमाणु द्रव्यमानों का योग", "एक अणु का द्रव्यमान", "किसी यौगिक के एक मोल का द्रव्यमान"], correct: 1 },
                    { id: 18, text: "Q.18 जब किसी पिंड का वेग बढ़कर अपने मूल मान से दोगुना हो जाता है, तो उसकी गतिज ऊर्जा पर क्या प्रभाव पड़ता है?", options: ["यह मूल मान की आधी हो जाती है", "यह अपरिवर्तित रहती है", "यह मूल मान का चार गुना हो जाती है", "यह मूल मान का दोगुना हो जाती है"], correct: 2 },
                    { id: 19, text: "Q.19 किसी वस्तु के द्रव्यमान और भार के लिए निम्नलिखित में से कौन-सा कथन सही है?", options: ["द्रव्यमान और भार दोनों स्थिर हैं", "द्रव्यमान स्थिर है और भार परिवर्तनशील है", "द्रव्यमान और भार दोनों परिवर्तनशील हैं", "द्रव्यमान परिवर्तनशील है और भार स्थिर है"], correct: 1 },
                    { id: 20, text: "Q.20 न्यूक्लिऑन, परमाणु में पाए जाने वाले अवपरमाण्विक कण होते हैं। इनमें शामिल होते हैं।", options: ["प्रोटॉन और न्यूट्रॉन", "इलेक्ट्रॉन", "केवल प्रोटॉन", "केवल न्यूट्रॉन"], correct: 0 },
                    { id: 21, text: "Q.21 कृषि भूमि से निम्नलिखित में से किस खरपतवार को हटाना किसानों के लिए लाभदायक होगा?", options: ["सूर्यमुखी", "गेहूं", "पार्थेनियम", "सोयाबीन"], correct: 2 },
                    { id: 22, text: "Q.22 एक तैराक पानी को पीछे की ओर धकेलता है। तैराक को आगे की ओर धकेलने वाला प्रतिक्रिया बल ..........", options: ["हवा तैराक को आगे की ओर धकेलती है", "पानी तैराक को आगे की ओर धकेलता है", "गुरुत्वाकर्षण तैराक को आगे की ओर धकेलता है", "पानी तैराक को पीछे की ओर धकेलता है"], correct: 1 },
                    { id: 23, text: "Q.23 निम्नलिखित में से कौन-सा कोशिका के संरचनात्मक संगठन का एक भाग नहीं है?", options: ["माइटोकॉन्ड्रिया", "कोशिका द्रव्य", "हृदय", "कोशिका भित्ति"], correct: 2 },

                    { id: 65, text: "Q.65 M, N, O, P, W, X और Y एक गोल मेज के परितः केन्द्र की ओर अभिमुख होकर बैठे हैं। O के दाईं ओर से गिनने पर X और W के बीच केवल दो लोग बैठे हैं। W के दाईं ओर से गिनने पर W और M के बीच केवल दो लोग बैठे हैं। O के दाईं ओर से गिनने पर X और N के बीच केवल तीन लोग बैठे हैं। Y के ठीक बाईं ओर पड़ोस में P बैठा है। O के बाईं ओर तीसरे स्थान पर कौन बैठा है?", options: ["M", "X", "Y", "P"], correct: 2 },
                    { id: 66, text: "Q.66 एक निश्चित कूट भाषा में, 'nice large land' को 'cd ak pi' के रूप में कूटबद्ध किया जाता है और, 'land is fertile' को 'rf pc ak' के रूप में कूटबद्ध किया जाता है तथा 'cost is high' को 'si ig pc' के रूप में कूटबद्ध किया जाता है। दी गई भाषा में 'fertile' को किस प्रकार कूटबद्ध किया जाता है?", options: ["rf", "ak", "pc", "cd"], correct: 0 },

                    { id: 69, text: "Q.69 दी गई श्रृंखला में प्रश्न-चिन्ह (?) के स्थान पर क्या आएगा?\n15 17 21 23 27 ?", options: ["31", "33", "30", "29"], correct: 3 },

                    { id: 97, text: "Q.97 SBI की जनवरी 2025 की रिपोर्ट के अनुसार वित्तीय वर्ष 24 के लिए भारत में शहरी गरीबी दर कितनी थी?", options: ["1.1%", "4.09%", "13.7%", "4.6%"], correct: 1 },
                    { id: 98, text: "Q.98 अंतरिक्ष अनुप्रयोगों (space applications) के लिए विकसित विक्रम 3201 और कल्पना 3201 माइक्रोप्रोसेसर किस प्रकार के माइक्रोप्रोसेसर हैं?", options: ["64-बिट माइक्रोप्रोसेसर", "16-बिट माइक्रोप्रोसेसर", "32-बिट माइक्रोप्रोसेसर", "8-बिट माइक्रोप्रोसेसर"], correct: 2 },
                    { id: 99, text: "Q.99 9 जून 2025 को किस भारतीय केंद्र शासित प्रदेश की विधानसभा ने पहली बार नेशनल ई-विधान एप्लीकेशन (National e-Vidhan Application) को अपनाया?", options: ["लक्षद्वीप", "दिल्ली", "पुडुचेरी", "चंडीगढ़"], correct: 2 },
                    { id: 100, text: "Q.100 निम्नलिखित में से किस मंत्री ने जून 2025 में राजस्थान में बीज और उर्वरक गोदामों पर अचानक छापे मारे?", options: ["मल्लिकार्जुन खड़गे", "योगी आदित्यनाथ", "ममता बनर्जी", "किरोड़ी लाल मीणा"], correct: 3 }
                ]
            }
        };

        let currentSubject = 'science';
        let currentQIndex = 0;

        let userAnswers = {};
        let qStatus = {};

        for (let sub in examData) {
            userAnswers[sub] = new Array(examData[sub].questions.length).fill(null);
            qStatus[sub] = new Array(examData[sub].questions.length).fill('not-visited');
        }

        // Timer Logic
        let totalSeconds = 90 * 60;
        const timerDisplay = document.getElementById('timer-display');

        const timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.innerText = `${minutes}:${seconds}`;

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Time Over! Test automatically submit ho raha hai.");
                submitTest();
            }
            totalSeconds--;
        }, 1000);

        function switchSubject(subKey, evt) {
            currentSubject = subKey;
            currentQIndex = 0;

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }

            document.getElementById('subject-title').innerText = examData[subKey].name;
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const qList = examData[currentSubject].questions;
            const q = qList[index];

            if (qStatus[currentSubject][index] === 'not-visited') {
                qStatus[currentSubject][index] = 'not-answered';
            }

            document.getElementById('question-number').innerText = `Question No. ${q.id}`;
            document.getElementById('question-text').innerText = q.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, optIdx) => {
                const isChecked = userAnswers[currentSubject][index] === optIdx;
                const label = document.createElement('label');
                if (isChecked) {
                    label.classList.add('selected-option');
                }
                
                label.innerHTML = `
                    <input type="radio" name="opt" value="${optIdx}" ${isChecked ? 'checked' : ''}>
                    <span>${opt}</span>
                `;
                
                label.addEventListener('click', function () {
                    document.querySelectorAll('.options-container label').forEach(l => l.classList.remove('selected-option'));
                    this.classList.add('selected-option');
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                    }
                    
                    userAnswers[currentSubject][currentQIndex] = optIdx;
                    qStatus[currentSubject][currentQIndex] = 'answered';
                    updatePaletteUI();
                });

                container.appendChild(label);
            });

            updatePaletteUI();
        }

        function saveAndNext() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
                qStatus[currentSubject][currentQIndex] = 'answered'; // GREEN
            } else {
                if (qStatus[currentSubject][currentQIndex] !== 'review') {
                    qStatus[currentSubject][currentQIndex] = 'not-answered'; // RED
                }
            }

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
                alert(`Aap ${examData[currentSubject].name} section ke aakhri question par hain!`);
            }
        }

        function clearOption() {
            userAnswers[currentSubject][currentQIndex] = null;
            qStatus[currentSubject][currentQIndex] = 'not-answered'; // RED
            loadQuestion(currentQIndex);
        }

        function markForReview() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
            }
            qStatus[currentSubject][currentQIndex] = 'review'; // PURPLE

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
            }
        }

        function updatePaletteUI() {
            const paletteGrid = document.getElementById('question-palette');
            paletteGrid.innerHTML = '';

            const qList = examData[currentSubject].questions;
            let countAnswered = 0, countNotAnswered = 0, countNotVisited = 0, countReview = 0;

            qList.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${idx === currentQIndex ? 'active' : ''}`;
                btn.innerText = q.id;

                const status = qStatus[currentSubject][idx];
                if (status === 'answered') {
                    btn.classList.add('status-answered');
                    countAnswered++;
                } else if (status === 'not-answered') {
                    btn.classList.add('status-not-answered');
                    countNotAnswered++;
                } else if (status === 'review') {
                    btn.classList.add('status-review');
                    countReview++;
                } else {
                    btn.classList.add('status-not-visited');
                    countNotVisited++;
                }

                btn.onclick = () => loadQuestion(idx);
                paletteGrid.appendChild(btn);
            });

            document.getElementById('count-answered').innerText = countAnswered;
            document.getElementById('count-not-answered').innerText = countNotAnswered;
            document.getElementById('count-not-visited').innerText = countNotVisited;
            document.getElementById('count-review').innerText = countReview;
        }

        function submitTest() {
            clearInterval(timerInterval);

            let totalMarks = 0;
            let totalCorrect = 0;
            let totalWrong = 0;

            for (let sub in examData) {
                const qList = examData[sub].questions;
                qList.forEach((q, idx) => {
                    const ans = userAnswers[sub][idx];
                    if (ans !== null) {
                        if (ans === q.correct) {
                            totalMarks += 1;
                            totalCorrect++;
                        } else {
                            totalMarks -= 0.33;
                            totalWrong++;
                        }
                    }
                });
            }

            alert(`--- FINAL RESULT SUMMARY ---
Total Correct: ${totalCorrect}
Total Wrong: ${totalWrong}
Final Score: ${totalMarks.toFixed(2)} Marks`);
        }

        loadQuestion(0);
    </script>
</body>
</html>
