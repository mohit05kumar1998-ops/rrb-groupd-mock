<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRB Group D CBT Exam Portal (Subject Wise)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; }
        body { background-color: #f0f0f0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Header */
        header { background: #337ab7; color: white; padding: 10px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Candidate Info Bar */
        .sub-header { background: #e8e8e8; padding: 8px 20px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .candidate-info { display: flex; align-items: center; gap: 15px; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .timer-box { background: #d9534f; color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold; font-size: 16px; }

        /* Subject Navigation Tabs */
        .subject-tabs { background: #fff; border-bottom: 2px solid #337ab7; display: flex; gap: 2px; padding-left: 10px; }
        .tab-btn { background: #e0e0e0; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; font-size: 13px; color: #333; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: #337ab7; color: white; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Section: Question Area */
        .question-area { width: 75%; background: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #ccc; overflow-y: auto; }
        .q-header { border-bottom: 2px solid #337ab7; padding-bottom: 8px; margin-bottom: 15px; font-weight: bold; color: #337ab7; display: flex; justify-content: space-between; }
        .q-text { font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #222; line-height: 1.5; }
        .options-container label { display: block; margin-bottom: 12px; padding: 10px 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .options-container label:hover { background: #eef5fc; border-color: #337ab7; }
        .options-container input { margin-right: 10px; }

        /* Bottom Controls */
        .action-bar { border-top: 1px solid #ddd; padding-top: 15px; display: flex; justify-content: space-between; background: white; }
        .btn-group-left, .btn-group-right { display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 13px; text-transform: uppercase; }
        .btn-save { background: #5cb85c; color: white; }
        .btn-clear { background: #f0ad4e; color: white; }
        .btn-review { background: #0275d8; color: white; }
        .btn-submit { background: #d9534f; color: white; }

        /* Right Section: Palette */
        .palette-area { width: 25%; background: #f4f6f9; padding: 15px; display: flex; flex-direction: column; }
        .palette-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .badge { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: white; border-radius: 3px; font-weight: bold; }
        
        .status-answered { background-color: #5cb85c; }
        .status-not-answered { background-color: #d9534f; }
        .status-review { background-color: #843534; }
        .status-not-visited { background-color: #fff; color: #333; border: 1px solid #ccc; }

        .q-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 350px; overflow-y: auto; }
        .q-btn { width: 38px; height: 38px; border: 1px solid #ccc; background: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .q-btn.active { outline: 2px solid #337ab7; }
    </style>
</head>
<body>

    <header>
        <div>RRB Group D Online CBT Examination</div>
    </header>

    <div class="sub-header">
        <div class="candidate-info">
            <div class="user-img">User</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;">Candidate Name: Roll No. 102938</div>
                <div style="font-size: 12px; color: #555;">Subject: Full Length Mock Test</div>
            </div>
        </div>
        <div class="timer-box">Time Left: <span id="timer-display">90:00</span></div>
    </div>

    <!-- Subject Tabs -->
    <div class="subject-tabs">
        <button class="tab-btn active" onclick="switchSubject('science')">General Science</button>
        <button class="tab-btn" onclick="switchSubject('maths')">Mathematics</button>
        <button class="tab-btn" onclick="switchSubject('reasoning')">Reasoning</button>
        <button class="tab-btn" onclick="switchSubject('ga')">General Awareness</button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        
        <div class="question-area">
            <div>
                <div class="q-header">
                    <span id="question-number">Question No. 1</span>
                    <span id="subject-title" style="font-size: 13px; color: #666;">General Science</span>
                </div>
                <div class="q-text" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
            </div>

            <div class="action-bar">
                <div class="btn-group-left">
                    <button class="btn btn-clear" onclick="clearOption()">Clear Response</button>
                    <button class="btn btn-review" onclick="markForReview()">Mark for Review & Next</button>
                </div>
                <div class="btn-group-right">
                    <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
                    <button class="btn btn-submit" onclick="submitTest()">Submit Test</button>
                </div>
            </div>
        </div>

        <div class="palette-area">
            <div class="palette-legend">
                <div class="legend-item"><span class="badge status-answered" id="count-answered">0</span> Answered</div>
                <div class="legend-item"><span class="badge status-not-answered" id="count-not-answered">0</span> Not Answered</div>
                <div class="legend-item"><span class="badge status-not-visited" id="count-not-visited">0</span> Not Visited</div>
                <div class="legend-item"><span class="badge status-review" id="count-review">0</span> Marked for Review</div>
            </div>

            <div style="font-weight: bold; font-size: 13px; margin-bottom: 10px;">Question Palette:</div>
            <div class="q-grid" id="question-palette"></div>
        </div>

    </div>

    <script>
        // -------------------------------------------------------------
        // PDF QUESTONS DATA (Extracted from RRB Level 01 PDF)
        // -------------------------------------------------------------
        const examData = {
            science: {
                name: "General Science",
                questions: [
                    { id: 1, text: "Q.1 जीवों में लैंगिक जनन के संबंध में सही विशेषता का चयन कीजिए।", options: ["यह जनक के बिल्कुल समान संतति उत्पन्न करता है।", "यह बड़ी संख्या में संतति उत्पन्न करता है।", "यह केवल एक जनक का ही DNA संतति में पारित करता है।", "यह संतति में दो माता-पिता के DNA को संयुक्त करता है।"], correct: 3 },
                    { id: 2, text: "Q.2 मटर का पौधा अन्य पौधों पर चढ़ने के लिए किस संरचना का उपयोग करता है?", options: ["प्ररोह (Shoot)", "प्रवाहक (Runner)", "चूसक (Sucker)", "प्रतान (Tendrils)"], correct: 3 },
                    { id: 3, text: "Q.3 क्रिकेट खिलाड़ी तेज गति से आती गेंद को पकड़ते समय अपने हाथों को पीछे की ओर क्यों खींच लेता है?", options: ["संघट्ट का समय बढ़ाने के लिए ताकि हाथों पर लगने वाला बल कम हो जाए", "गेंद का त्वरण बढ़ाने के लिए", "गेंद का संवेग कम करने के लिए", "गेंद पर कार्यरत बल को बढ़ाने के लिए"], correct: 0 },
                    { id: 4, text: "Q.4 जंतुओं के संयोजी ऊतकों में, वसा कोशिकाएं लोब्यूल्स में व्यवस्थित होती हैं, जो ________ विभाजन द्वारा पृथक होती हैं।", options: ["कोलेजन और इलास्टिन तंतु (collagen and elastin fibres)", "पीत तंतु और लसीका (yellow fibres and lymph)", "कंकाल तंतु और कंडरा (skeletal fibres and tendons)", "रेटिकुलर तंतु और प्लाज्मा (reticular fibres and plasma)"], correct: 0 },
                    { id: 5, text: "Q.5 निम्नलिखित में से कौन-सा अल्ट्रासाउंड का अनुप्रयोग नहीं है?", options: ["नियमित श्रवण परीक्षण", "धातु ब्लॉकों में दरारों का पता लगाना", "वस्तुओं की सफाई", "मेडिकल इमेजिंग"], correct: 0 },
                    { id: 6, text: "Q.6 धातुओं का संक्षारण एक ऐसी प्रक्रिया है, जिसमें", options: ["धातुएं अपना रंग स्थायी रूप से बदल देती हैं", "धातुएं पर्यावरणीय कारकों के साथ अभिक्रिया करके ऑक्साइड, सल्फाइड या कार्बोनेट में रूपांतरित हो जाती हैं", "अम्लों के साथ अभिक्रिया के कारण धातुओं का भार बढ़ जाता है", "धातुएं निम्न तापमान पर पिघल जाती हैं"], correct: 1 },
                    { id: 7, text: "Q.7 निम्नलिखित में से कौन-सा, वंशागति के संबंध में मेन्डल के निष्कर्ष को सही रूप से दर्शाते हैं?", options: ["प्रत्येक विशेषक तीन जीनों द्वारा नियंत्रित होते है।", "प्रत्येक विशेषक एक गुणसूत्र द्वारा नियंत्रित होते है।", "प्रत्येक विशेषक दो कारकों द्वारा नियंत्रित होते है।", "प्रत्येक विशेषक एक कारक द्वारा नियंत्रित होते है।"], correct: 2 },
                    { id: 8, text: "Q.8 निम्नलिखित में से कौन-सा, गैस पर दाब बढ़ाने का परिणाम है?", options: ["गैस का वाष्पन", "गतिज ऊर्जा में वृद्धि", "अंतःकण स्थान में वृद्धि", "अंतःकण स्थान में कमी"], correct: 3 },
                    { id: 9, text: "Q.9 एक वस्तु को 78.4 m की ऊंचाई से गिराया जाता है। भूतल तक पहुँचने में उसके द्वारा लिया गया समय ज्ञात कीजिए। (g = 9.8 m/s² का उपयोग कीजिए)", options: ["5 s", "6 s", "2 s", "4 s"], correct: 3 },
                    { id: 10, text: "Q.10 निम्नलिखित में से कौन सी विधि फसलों के लिए जल उपलब्धता में वृद्धि हेतु सिंचाई की नई पहल का हिस्सा है?", options: ["वर्षा जल संचयन और जलग्रहण प्रबंधन", "खाद और रासायनिक छिड़काव", "ड्रिप सिंचाई और फसल चक्रण", "स्प्रिंकलर सिंचाई और जुताई"], correct: 0 },
                    { id: 11, text: "Q.11 यदि किसी तार की लंबाई दोगुनी कर दी जाए और उसका अनुप्रस्थ काट क्षेत्रफल आधा कर दिया जाए, तो उसका प्रतिरोध ________ हो जाएगा।", options: ["मूल का एक-चौथाई", "मूल का चार गुना", "मूल का दोगुना", "मूल का आधा"], correct: 1 },
                    { id: 12, text: "Q.12 निम्नलिखित में से कौन-सा, रासायनिक ऊर्जा के ऊष्मा ऊर्जा में रूपांतरण का सर्वोत्तम उदाहरण है?", options: ["विद्युत से चलने वाली मोटर", "सौर कुकर से भोजन गर्म करना", "बैटरी द्वारा बल्ब जलाना", "लकड़ी का जलना"], correct: 3 },
                    { id: 13, text: "Q.13 ⁴⁰₁₈Ar और ⁴⁰₂₀Ca ________ का एक युग्म हैं।", options: ["समस्थानिकों (isotopes)", "समन्यूट्रॉनी (isotones)", "समइलेक्ट्रॉनी (isoelectronic)", "समभारिक (isobars)"], correct: 3 },
                    { id: 14, text: "Q.14 एक पौधे को उखाड़कर धूप में छोड़ दिया गया। कुछ घंटों बाद, पौधा मुरझाया हुआ और कमज़ोर दिख रहा था। इसका सबसे संभावित कारण क्या हो सकता है?", options: ["जाइलम के माध्यम से भोजन स्थानांतरण अवरुद्ध हो गया", "जाइलम के माध्यम से जल चालन प्रारंभ हो गया", "फ्लोएम के माध्यम से भोजन स्थानांतरण प्रारंभ हो गया", "जाइलम के माध्यम से जल चालन अवरुद्ध हो गया"], correct: 3 },
                    { id: 15, text: "Q.15 कार्बन का वह विशिष्ट लक्षण क्या है, जो इसके अधिक संख्या में कार्बनिक यौगिकों के निर्माण का कारण बनता है?", options: ["केवल चतुः संयोजकता", "केवल श्रृंखलन", "विलेयता", "चतुःसंयोजकता (tetravalency) और श्रृंखलन दोनों"], correct: 3 },
                    { id: 16, text: "Q.16 अयस्क से अपअयस्क (gangue) को हटाने के लिए उपयोग की जाने वाली प्रक्रियाएं, अपअयस्क और अयस्क के किन गुणों के बीच अंतर पर आधारित हैं?", options: ["केवल भौतिक", "रासायनिक या भौतिक", "केवल रासायनिक", "अपवर्तनांक (Refractive index)"], correct: 1 },
                    { id: 17, text: "Q.17 हाइड्रोक्लोरिक एसिड के साथ धातु सोडियम कार्बोनेट और सोडियम बाइकार्बोनेट की अभिक्रिया में क्या समानता है?", options: ["कार्बन मोनोऑक्साइड मुक्त होता है", "हाइड्रोजन गैस मुक्त होती है", "हाइड्रोजन कार्बोनेट बनता है।", "सोडियम क्लोराइड बनता है।"], correct: 3 },
                    { id: 18, text: "Q.18 निम्नलिखित में से कौन-सा विकल्प पदार्थ के मापनीय गुण और उसकी SI इकाई के संदर्भ में सुमेलित है?", options: ["आयतन - घन सेंटीमीटर", "दाब - न्यूटन", "तापमान - कैलोरी", "घनत्व - किलोग्राम प्रति घन मीटर"], correct: 3 },
                    { id: 19, text: "Q.19 एक भारी लकड़ी के गुटके को किसी खुरदरे फर्श पर धकेला जाता है। लगाया गया बल धीरे-धीरे बढ़ाया जाता है।\n1. पहले तो ब्लॉक हिलता नहीं है।\n2. फिर, एक निश्चित बल पर, ब्लॉक फिसलना शुरू कर देता है।\n3. अंततः, जब ब्लॉक फिसल रहा होता है, तो वह स्थिर वेग से चलता है।\nनिम्नलिखित में से कौन सा कथन इन तीन चरणों में बल की स्थिति का सही वर्णन करता है?", options: ["चरण 1-संतुलित, चरण 2-संतुलित, चरण 3-असंतुलित", "चरण 1-संतुलित, चरण 2-असंतुलित, चरण 3-संतुलित", "चरण 1-असंतुलित, चरण 2-संतुलित, चरण 3-संतुलित", "चरण 1-असंतुलित, चरण 2-असंतुलित, चरण 3-संतुलित"], correct: 1 },
                    { id: 20, text: "Q.20 उत्तल लेंस को अभिसारी लेंस भी कहा जाता है, क्योंकि", options: ["यह समानांतर किरणों को एक बिंदु पर केंद्रित करता है", "यह प्रकाश किरणों को बिल्कुल भी बंकित नहीं करता है", "यह सदैव आभासी प्रतिबिम्ब बनाता है", "यह प्रकाश किरणों को एक दूसरे से दूर अपसारित करता है"], correct: 0 },
                    { id: 21, text: "Q.21 सांद्र सल्फ्यूरिक अम्ल को निर्जलीकरण कारक माना जा सकता है क्योंकि यह निम्नलिखित में से किसमें से जल को हटाता है?", options: ["प्रोपेन", "सोडियम हाइड्रॉक्साइड", "अमोंनिया गैस", "ग्लूकोज"], correct: 3 },
                    { id: 22, text: "Q.22 एककोशिकीय जीव का समान आनुवंशिक सामग्री वाले दो बराबर संतति कोशिकाओं में विभाजन को निम्नलिखित में से क्या कहा जाता है?", options: ["मुकुलन", "बीजाणु निर्माण", "बाइनरी विखंडन (Binary Fission)", "संयुग्मन"], correct: 2 },

                    { id: 9, text: "Q.89 आंतरिक विस्थापन निगरानी केंद्र की रिपोर्ट के अनुसार, 2015 से 2024 के बीच भारत में आपदाओं के कारण कितने आंतरिक विस्थापन दर्ज किए गए?", options: ["50 मिलियन", "10 मिलियन", "25.4 मिलियन", "32.3 मिलियन"], correct: 3 },
                    { id: 10, text: "Q.90 जनवरी 2025 समारोह के दौरान, कितने एथलीटों को अर्जुन पुरस्कार, 2024 प्राप्त हुआ?", options: ["32", "40", "28", "34"], correct: 3 },
                    { id: 11, text: "Q.91 कौन-सा ग्रुप गुजरात के जामनगर में वन्यजीव संरक्षण की पहल 'वंतारा' का स्वामित्व और सहयोग करता है, जिसका उद्घाटन मार्च 2025 में हुआ?", options: ["वाडिया ग्रुप (Wadia Group)", "रिलायंस ग्रुप (Reliance Group)", "टाटा ग्रुप (Tata Group)", "डालमिया ग्रुप (Dalmia Group)"], correct: 1 },
                    { id: 12, text: "Q.92 2025 में, किस कंपनी ने विरासत जल निकायों के जीर्णोद्धार के लिए भारतीय पुरातत्व सर्वेक्षण (ASI) के साथ साझेदारी की है?", options: ["डाबर (Dabur)", "नेस्ले (Nestle)", "पेप्सी (Pepsi)", "बिसलेरी (Bisleri)"], correct: 3 },
                    { id: 13, text: "Q.93 जुलाई 2025 में, किस संस्थान ने आंध्र प्रदेश के अमरावती में भारत के पहले AI प्लस कैंपस (AI Plus Campus) की घोषणा की?", options: ["IIT मद्रास", "NIT वारंगल", "BITS पिलानी", "IIIT हैदराबाद"], correct: 3 },
                    { id: 14, text: "Q.94 RBI के वित्तीय साक्षरता सप्ताह (FLW) 2025 का विषय (theme) क्या था?", options: ["महिला और वित्तीय प्रौद्योगिकी", "सभी के लिए डिजिटल वित्त", "वित्तीय साक्षरताः महिलाओं की समृद्धि (Financial Literacy: Women's Prosperity)", "वित्तीय समावेशनः भारत का विकास"], correct: 2 },
                    { id: 15, text: "Q.95 एशियाई खेल 2025 में भाला फेंक में स्वर्ण जीतने वाली पहली भारतीय महिला कौन बनी?", options: ["शालिनी शर्मा", "अन्नू रानी", "कमलप्रीत कौर", "सीमा अंतिल"], correct: 1 },
                    { id: 16, text: "Q.96 अर्जुन पुरस्कार 2025 (लाइफटाइम) प्राप्त करने वाले पहले पैरालंपिक स्वर्ण पदक विजेता कौन थे?", options: ["देवेंद्र झाझरिया", "मुरलीकांत पेटकर", "वरुण भाटी", "दीपा मलिक"], correct: 1 },
                    { id: 17, text: "Q.97 किस बैंक ने FY25 की Q4 में ₹5,004 करोड़ के स्टैंडअलोन नेट प्रॉफिट में 33 प्रतिशत की वृद्धि दर्ज की?", options: ["भारतीय स्टेट बैंक", "बैंक ऑफ बड़ौदा", "केनरा बैंक", "पंजाब नेशनल बैंक"], correct: 2 },
                    { id: 18, text: "Q.98 किस देश ने जून 2025 में, अंतर्राष्ट्रीय बिग कैट एलायंस (IBCA) की पहली सभा की मेजबानी की?", options: ["इंडोनेशिया", "जर्मनी", "इटली", "भारत"], correct: 3 },
                    { id: 19, text: "Q.99 मई 2025 में छह अफ्रीकी देशों ने WHO के साथ काला अज़ार से निपटने हेतु समझौता किया। काला अज़ार क्या है?", options: ["मच्छरों द्वारा संचरित विषाणु ज्वर", "आनुवंशिक विकार", "सेंडफ्लाई के काटने से होने वाला एक परजीवी रोग", "दूषित जल से फैलने वाला जीवाणु संक्रमण"], correct: 2 },
                    { id: 20, text: "Q.100 20 जून 2025 को भारत के पहले स्वदेशी रूप से निर्मित लोकोमोटिव को किस देश में निर्यात हेतु हरी झंडी दिखाई गई?", options: ["गिनी गणराज्य", "चीन", "स्पेन", "मंगोलिया"], correct: 0 }
                ]
            }
        };

        // System States
        let currentSubject = 'science';
        let currentQIndex = 0;

        // Initialize answer & status states for each subject
        let userAnswers = {};
        let qStatus = {};

        for (let sub in examData) {
            userAnswers[sub] = new Array(examData[sub].questions.length).fill(null);
            qStatus[sub] = new Array(examData[sub].questions.length).fill('not-visited');
        }

        // -------------------------------------------------------------
        // TIMER SCRIPT (90 Mins)
        // -------------------------------------------------------------
        let totalSeconds = 90 * 60;
        const timerDisplay = document.getElementById('timer-display');

        const timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.innerText = `${minutes}:${seconds}`;

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Time Over! Test automatically submit ho raha hai.");
                submitTest();
            }
            totalSeconds--;
        }, 1000);

        // -------------------------------------------------------------
        // SUBJECT & QUESTION SWITCHING
        // -------------------------------------------------------------
        function switchSubject(subKey) {
            currentSubject = subKey;
            currentQIndex = 0;

            // Update Tab UI
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            
            // Find clicked tab or set active based on index
            const tabs = ['science', 'maths', 'reasoning', 'ga'];
            const activeIndex = tabs.indexOf(subKey);
            if (btns[activeIndex]) {
                btns[activeIndex].classList.add('active');
            }

            document.getElementById('subject-title').innerText = examData[subKey].name;
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const qList = examData[currentSubject].questions;
            const q = qList[index];

            if (qStatus[currentSubject][index] === 'not-visited') {
                qStatus[currentSubject][index] = 'not-answered';
            }

            document.getElementById('question-number').innerText = `Question No. ${index + 1}`;
            document.getElementById('question-text').innerText = q.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, optIdx) => {
                const isChecked = userAnswers[currentSubject][index] === optIdx ? 'checked' : '';
                container.innerHTML += `
                    <label>
                        <input type="radio" name="opt" value="${optIdx}" ${isChecked}>
                        ${opt}
                    </label>
                `;
            });

            updatePaletteUI();
        }

        function saveAndNext() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
                qStatus[currentSubject][currentQIndex] = 'answered';
            } else {
                if (qStatus[currentSubject][currentQIndex] !== 'review') {
                    qStatus[currentSubject][currentQIndex] = 'not-answered';
                }
            }

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
                alert(`Aap ${examData[currentSubject].name} section ke aakhri question par hain!`);
            }
        }

        function clearOption() {
            userAnswers[currentSubject][currentQIndex] = null;
            qStatus[currentSubject][currentQIndex] = 'not-answered';
            loadQuestion(currentQIndex);
        }

        function markForReview() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
            }
            qStatus[currentSubject][currentQIndex] = 'review';

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
            }
        }

        // -------------------------------------------------------------
        // PALETTE & RESULT CALCULATION
        // -------------------------------------------------------------
        function updatePaletteUI() {
            const paletteGrid = document.getElementById('question-palette');
            paletteGrid.innerHTML = '';

            const qList = examData[currentSubject].questions;
            let countAnswered = 0, countNotAnswered = 0, countNotVisited = 0, countReview = 0;

            qList.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${idx === currentQIndex ? 'active' : ''}`;
                btn.innerText = idx + 1;

                const status = qStatus[currentSubject][idx];
                if (status === 'answered') {
                    btn.classList.add('status-answered');
                    countAnswered++;
                } else if (status === 'not-answered') {
                    btn.classList.add('status-not-answered');
                    countNotAnswered++;
                } else if (status === 'review') {
                    btn.classList.add('status-review');
                    countReview++;
                } else {
                    btn.classList.add('status-not-visited');
                    countNotVisited++;
                }

                btn.onclick = () => loadQuestion(idx);
                paletteGrid.appendChild(btn);
            });

            document.getElementById('count-answered').innerText = countAnswered;
            document.getElementById('count-not-answered').innerText = countNotAnswered;
            document.getElementById('count-not-visited').innerText = countNotVisited;
            document.getElementById('count-review').innerText = countReview;
        }

        function submitTest() {
            clearInterval(timerInterval);

            let totalMarks = 0;
            let totalCorrect = 0;
            let totalWrong = 0;

            for (let sub in examData) {
                const qList = examData[sub].questions;
                qList.forEach((q, idx) => {
                    const ans = userAnswers[sub][idx];
                    if (ans !== null) {
                        if (ans === q.correct) {
                            totalMarks += 1;
                            totalCorrect++;
                        } else {
                            totalMarks -= 0.33;
                            totalWrong++;
                        }
                    }
                });
            }

            alert(`--- FINAL RESULT SUMMARY ---
Total Correct: ${totalCorrect}
Total Wrong: ${totalWrong}
Final Score: ${totalMarks.toFixed(2)} Marks`);
        }

        // Initial Load
        loadQuestion(0);
    </script>
