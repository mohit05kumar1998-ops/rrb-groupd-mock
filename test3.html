<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Exam Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --correct: #22c55e;
            --wrong: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { margin: 0; font-size: 1.5rem; }
        .timer { font-size: 1.2rem; font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 6px; }

        .section-tabs {
            display: flex;
            background: #e5e7eb;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4b5563;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .quiz-body { padding: 30px; }

        .progress-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .question-title {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .options-grid { display: grid; gap: 12px; margin-bottom: 25px; }

        .option-card {
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-card:hover { border-color: var(--primary); background: #f9fafb; }
        .option-card.selected { border-color: var(--primary); background: #eeefef; }
        .option-card.correct { border-color: var(--correct); background: #dcfce7; color: #14532d; font-weight: bold; }
        .option-card.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-submit { background: #22c55e; color: white; }

        .results-card { text-align: center; padding: 40px 20px; }
        .results-card h2 { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .score-box { font-size: 3rem; font-weight: bold; margin: 20px 0; color: #1f2937; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>Exam Portal</h1>
        <div class="timer" id="timer">Time Left: 60:00</div>
    </div>

    <div class="section-tabs">
        <button class="tab-btn active" onclick="switchSection('science')">Science (1-25)</button>
        <button class="tab-btn" onclick="switchSection('maths')">Maths (26-50)</button>
        <button class="tab-btn" onclick="switchSection('reasoning')">Reasoning (51-80)</button>
        <button class="tab-btn" onclick="switchSection('ga')">GA (81-100)</button>
    </div>

    <div class="quiz-body" id="quiz-body">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="question-title" id="question-text"></div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <div class="footer" id="quiz-footer">
        <button class="btn btn-secondary" onclick="prevQuestion()" id="prev-btn">Previous</button>
        <div>
            <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn">Next</button>
            <button class="btn btn-submit" onclick="submitQuiz()" style="display:none;" id="submit-btn">Submit Exam</button>
        </div>
    </div>
</div>

    let currentSection = 'science';
    let currentIndex = 0;
    let userAnswers = {}; // Save user responses

    function loadQuestion() {
        const qData = examData[currentSection].questions[currentIndex];
        const totalQ = 100;
        const globalIndex = qData.id;

        // Progress Bar Update
        document.getElementById('progress').style.width = `${(globalIndex / totalQ) * 100}%`;

        // Question text
        document.getElementById('question-text').innerText = qData.text;

        // Render Options
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.options.forEach((opt, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            
            // Check if already answered
            if (userAnswers[qData.id] !== undefined) {
                if (idx === qData.correct) card.classList.add('correct');
                if (userAnswers[qData.id] === idx && idx !== qData.correct) card.classList.add('wrong');
            }

            card.innerText = opt;
            card.onclick = () => selectOption(qData.id, idx, qData.correct);
            container.appendChild(card);
        });

        // Toggle submit button on last question
        if (globalIndex === 100) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'inline-block';
        } else {
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('submit-btn').style.display = 'none';
        }
    }

    function selectOption(qId, selectedIdx, correctIdx) {
        if (userAnswers[qId] !== undefined) return; // Prevent changing answer once selected

        userAnswers[qId] = selectedIdx;
        loadQuestion();
    }

    function switchSection(secKey) {
        currentSection = secKey;
        currentIndex = 0;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        loadQuestion();
    }

    function nextQuestion() {
        const currentList = examData[currentSection].questions;
        if (currentIndex < currentList.length - 1) {
            currentIndex++;
        } else {
            // Auto-switch to next section
            if (currentSection === 'science') switchSectionAuto('maths', 1);
            else if (currentSection === 'maths') switchSectionAuto('reasoning', 2);
            else if (currentSection === 'reasoning') switchSectionAuto('ga', 3);
        }
        loadQuestion();
    }

    function switchSectionAuto(secKey, tabIndex) {
        currentSection = secKey;
        currentIndex = 0;
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => btn.classList.remove('active'));
        tabs[tabIndex].classList.add('active');
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function submitQuiz() {
        let score = 0;
        let total = 100;

        for (let sec in examData) {
            examData[sec].questions.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    score++;
                }
            });
        }

        document.getElementById('quiz-body').innerHTML = `
            <div class="results-card">
                <h2>Exam Completed!</h2>
                <p>Your Final Score:</p>
                <div class="score-box">${score} / ${total}</div>
                <p>Attempted: ${Object.keys(userAnswers).length} | Correct: ${score}</p>
            </div>
        `;
        document.getElementById('quiz-footer').style.display = 'none';
    }

    // Timer Logic
    let timeLeft = 3600; // 60 minutes
    setInterval(() => {
        if(timeLeft <= 0) return;
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timer').innerText = `Time Left: ${m}:${s < 10 ? '0' : ''}${s}`;
    }, 1000);

    // Initial Load
    loadQuestion();
</script>
