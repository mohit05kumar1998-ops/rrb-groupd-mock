<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RRB Group D CBT Exam Portal (Subject Wise - 100 Questions)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; }
        body { background-color: #f0f0f0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Header */
        header { background: #337ab7; color: white; padding: 10px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Candidate Info Bar */
        .sub-header { background: #e8e8e8; padding: 8px 20px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .candidate-info { display: flex; align-items: center; gap: 15px; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .timer-box { background: #d9534f; color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold; font-size: 16px; }

        /* Subject Navigation Tabs */
        .subject-tabs { background: #fff; border-bottom: 2px solid #337ab7; display: flex; gap: 2px; padding-left: 10px; overflow-x: auto; }
        .tab-btn { background: #e0e0e0; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; font-size: 13px; color: #333; border-radius: 5px 5px 0 0; white-space: nowrap; }
        .tab-btn.active { background: #337ab7; color: white; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Section: Question Area */
        .question-area { width: 75%; background: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #ccc; overflow-y: auto; }
        .q-header { border-bottom: 2px solid #337ab7; padding-bottom: 8px; margin-bottom: 15px; font-weight: bold; color: #337ab7; display: flex; justify-content: space-between; }
        .q-text { font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #222; white-space: pre-line; }
        
        /* Options Selection Styling */
        .options-container label { 
            display: flex; 
            align-items: center;
            margin-bottom: 12px; 
            padding: 12px 15px; 
            background: #f9f9f9; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .options-container label:hover { background: #eef5fc; border-color: #337ab7; }
        .options-container input[type="radio"] { margin-right: 12px; transform: scale(1.2); }

        /* Active Selected Option Color */
        .options-container label.selected-option,
        .options-container label:has(input[type="radio"]:checked) {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
            color: #0f5132 !important;
            font-weight: bold;
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .question-area { width: 100%; border-right: none; }
            .palette-area { width: 100%; }
        }

        /* Bottom Controls */
        .action-bar { border-top: 1px solid #ddd; padding-top: 15px; display: flex; justify-content: space-between; background: white; flex-wrap: wrap; gap: 10px; }
        .btn-group-left, .btn-group-right { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 13px; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        .btn-save { background: #5cb85c; color: white; }
        .btn-clear { background: #f0ad4e; color: white; }
        .btn-review { background: #8e44ad; color: white; } /* Purple */
        .btn-submit { background: #d9534f; color: white; }

        /* Right Section: Palette */
        .palette-area { width: 25%; background: #f4f6f9; padding: 15px; display: flex; flex-direction: column; }
        .palette-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .badge { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: white; border-radius: 3px; font-weight: bold; }
        
        /* TCS PALETTE STATUS COLOR CODES */
        .status-answered, button.q-btn.status-answered { background-color: #5cb85c !important; color: white !important; border-color: #4cae4c !important; }
        .status-not-answered, button.q-btn.status-not-answered { background-color: #d9534f !important; color: white !important; border-color: #d43f3a !important; }
        .status-review, button.q-btn.status-review { background-color: #8e44ad !important; color: white !important; border-color: #732d91 !important; } /* PURPLE */
        .status-not-visited, button.q-btn.status-not-visited { background-color: #fff !important; color: #333 !important; border: 1px solid #ccc !important; }

        .q-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 350px; overflow-y: auto; }
        .q-btn { width: 38px; height: 38px; border: 1px solid #ccc; background: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .q-btn.active { outline: 3px solid #337ab7; outline-offset: -1px; }
    </style>
</head>
<body>

    <header>
        <div>RRB Group D Online CBT Examination</div>
    </header>

    <div class="sub-header">
        <div class="candidate-info">
            <div class="user-img">User</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;">Candidate Name: Roll No. 102938</div>
                <div style="font-size: 12px; color: #555;">Subject: Full Length Mock Test</div>
            </div>
        </div>
        <div class="timer-box">Time Left: <span id="timer-display">90:00</span></div>
    </div>

    <!-- Subject Tabs -->
    <div class="subject-tabs">
        <button class="tab-btn active" onclick="switchSubject('science', event)">General Science</button>
        <button class="tab-btn" onclick="switchSubject('maths', event)">Mathematics</button>
        <button class="tab-btn" onclick="switchSubject('reasoning', event)">Reasoning</button>
        <button class="tab-btn" onclick="switchSubject('ga', event)">General Awareness</button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        
        <div class="question-area">
            <div>
                <div class="q-header">
                    <span id="question-number">Question No. 1</span>
                    <span id="subject-title" style="font-size: 13px; color: #666;">General Science</span>
                </div>
                <div class="q-text" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
            </div>

            <div class="action-bar">
                <div class="btn-group-left">
                    <button class="btn btn-clear" onclick="clearOption()">Clear Response</button>
                    <button class="btn btn-review" onclick="markForReview()">Mark for Review & Next</button>
                </div>
                <div class="btn-group-right">
                    <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
                    <button class="btn btn-submit" onclick="submitTest()">Submit Test</button>
                </div>
            </div>
        </div>

        <div class="palette-area">
            <div class="palette-legend">
                <div class="legend-item"><span class="badge status-answered" id="count-answered">0</span> Answered</div>
                <div class="legend-item"><span class="badge status-not-answered" id="count-not-answered">0</span> Not Answered</div>
                <div class="legend-item"><span class="badge status-not-visited" id="count-not-visited">0</span> Not Visited</div>
                <div class="legend-item"><span class="badge status-review" id="count-review">0</span> Marked for Review</div>
            </div>

            <div style="font-weight: bold; font-size: 13px; margin-bottom: 10px;">Question Palette:</div>
            <div class="q-grid" id="question-palette"></div>
        </div>

    </div>

    <script>
        const examData = {
            science: {
                name: "General Science",
                questions: [
                    { id: 1, text: "Q.1 आणविक द्रव्यमान की गणना कैसे की जाती है?", options: ["अणु में परमाणुओं के सभी परमाणु द्रव्यमानों को जोड़कर", "सभी तत्वों के परमाणु क्रमांकों का वर्ग करके", "घटक तत्वों की परमाणु त्रिज्याओं को गुणा करके", "उपस्थित परमाणुओं के सभी परमाणु आयतनों को जोड़कर"], correct: 0 },
                    { id: 2, text: "Q.2 लवण-जल से सोडियम हाइड्रॉक्साइड तैयार करने के लिए किस प्रक्रिया का उपयोग किया जाता है?", options: ["हाबर प्रक्रम (Haber process)", "लवण-जल का विद्युत अपघटन (Electrolysis of brine)", "सॉल्वे प्रक्रम (Solvay process)", "NaCl का ऊष्मीय अपघटन (Thermal decomposition of NaCl)"], correct: 1 },
                    { id: 3, text: "Q.3 एक आयताकार कांच की पट्टी के दो समानांतर विपरीत फलकों से प्रकाश गुजरने के बाद आपतित किरण और निर्गत किरण के बीच क्या संबंध होता है?", options: ["निर्गत किरण आपतित किरण की दिशा के समानांतर होती है, लेकिन थोड़ी सी साइड की ओर स्थानांतरित हो जाती है", "निर्गत किरण आपतित किरण के लंबवत होती है", "निर्गत किरण मुख्य अक्ष पर एक बिंदु पर अभिसरित होती है", "निर्गत किरण आपतित किरण के पथ पर वापस परावर्तित हो जाती है"], correct: 0 },
                    { id: 4, text: "Q.4 निम्नलिखित में से कौन-से कथन गोलीय दर्पण के मुख्य अक्ष के संबंध में सत्य नहीं हैं?\n(i) यह गोलीय दर्पण के ध्रुव और वक्रता केंद्र से होकर गुजरने वाली एक काल्पनिक सीधी रेखा है।\n(ii) मुख्य अक्ष दर्पण के ध्रुव पर अभिलंबवत होता है।\n(iii) मुख्य अक्ष के समान्तर एक किरण दर्पण से परावर्तन के पश्चात् दर्पण के वक्रता केन्द्र से होकर गुजरती है।\n(iv) गोलीय दर्पण का फोकस उसके मुख्य अक्ष पर नहीं होता है।", options: ["(ii) और (iii) दोनों", "(i) और (ii) दोनों", "(i) और (iv) दोनों", "(iii) और (iv) दोनों"], correct: 3 },
                    { id: 5, text: "Q.5 मरीज के दिल की धड़कन की आवाज छाती से स्टेथोस्कोप के माध्यम से डॉक्टर के कान तक कैसे पहुंचती है?", options: ["बिना परावर्तन के प्रत्यक्ष संचरण द्वारा", "ध्वनि तरंगों के अपवर्तन द्वारा", "विद्युत संकेतों में परिवर्तित करके", "ध्वनि के बहु-परावर्तन द्वारा"], correct: 3 },
                    { id: 6, text: "Q.6 निम्नलिखित में से कौन-सा कथन सही ढंग से वर्णन करता है कि दो बिंदुओं के बीच विभवांतर की गणना कैसे की जाती है?", options: ["विभवांतर = किया गया कार्य × स्थितिज ऊर्जा", "विभवांतर = आवेश / किया गया कार्य", "विभवांतर = किया गया कार्य + आवेश", "विभवांतर = किया गया कार्य / आवेश"], correct: 3 },
                    { id: 7, text: "Q.7 जिस प्रकार न्यूटन का संबंध भार से है, उसी प्रकार किसका संबंध दाब से है?", options: ["किलोग्राम", "केल्विन", "किलोग्राम प्रति घन मीटर", "पास्कल"], correct: 3 },
                    { id: 8, text: "Q.8 निम्नलिखित में से किस धात्विक ऑक्साइड को केवल गर्म करके धातु में अपचयित किया जा सकता है?", options: ["आयरन (III) ऑक्साइड", "मरक्यूरिक ऑक्साइड", "मैंगनीज ऑक्साइड", "जिंक ऑक्साइड"], correct: 1 },
                    { id: 9, text: "Q.9 जब ठोस लेड (II) नाइट्रेट को गर्म किया जाता है, तो एक पीला अवशिष्ट (PbO) रह जाता है और दो गैसें निकलती हैं - एक लाल-भूरे रंग की होती है तथा दूसरी दहन में सहायक होती है। कौन-सी गैसें निकलती हैं?", options: ["नाइट्रोजन डाइऑक्साइड और ऑक्सीजन", "नाइट्रोजन डाइऑक्साइड और हाइड्रोजन", "नाइट्रिक ऑक्साइड और ऑक्सीजन", "नाइट्रोजन गैस और कार्बन डाइऑक्साइड"], correct: 0 },
                    { id: 10, text: "Q.10 निम्नलिखित में से कौन-सा विभज्योतक, प्ररोहों और मूलों के सिरों (ends) पर लंबाई में वृद्धि के लिए उत्तरदायी है?", options: ["अंतर्वेशी विभज्योतक (Intercalary meristem)", "पार्श्विक विभज्योतक (Lateral meristem)", "शीर्षस्थ विभज्योतक (Apical meristem)", "स्थायी विभज्योतक (Permanent meristem)"], correct: 2 },
                    { id: 11, text: "Q.11 निम्नलिखित में से कौन-सी, गर्भनिरोधक विधि नहीं है?", options: ["गर्भ का गर्भपात", "कंडोम का उपयोग करके शुक्राणुओं को अंडे तक पहुँचने से रोकना", "गर्भाशय में कॉपर-T डालना", "अंडाशय से अंडों के निकलने को रोकने के लिए हार्मोनल संतुलन में परिवर्तन करना"], correct: 0 },
                    { id: 12, text: "Q.12 कोशिका आकार के संबंध में निम्नलिखित में से कौन-सा कथन सही है?", options: ["कोशिका का आकार केन्द्रकों की संख्या पर निर्भर करता है।", "बहुकोशिकीय जीवों में कोशिका का आकार हमेशा बड़ा होता है।", "कोशिका का आकार उसके कार्य से संबंधित होता है, जीव के आकार से संबंधित नहीं होता है।", "सभी जीवों में सभी कोशिकाएँ एक ही आकार की होती हैं।"], correct: 2 },
                    { id: 13, text: "Q.13 एक बर्तन में भरा तरल पदार्थ समान ऊंचाई पर ______ दाब डालता है।", options: ["केवल किनारों पर", "केवल नीचे की ओर", "पात्र की सभी दिशाओं में समान रूप से", "केवल ऊपर की ओर"], correct: 2 },
                    { id: 14, text: "Q.14 किसी वस्तु की प्रारंभिक और अंतिम स्थिति के बीच की सबसे छोटी दूरी को ______ कहा जाता है।", options: ["विस्थापन", "त्वरण", "चाल", "दूरी"], correct: 0 },
                    { id: 15, text: "Q.15 मधुमक्खी के सामान्य नाम को उसके वैज्ञानिक नाम से सुमेलित कीजिए।\nस्तंभ I (सामान्य नाम)\n1. भारतीय मधुमक्खी (Indian bee)\n2. शैल मधुमक्खी (Rock bee)\n3. लिटिल मधुमक्खी (Little bee)\n4. इटालियन मधुमक्खी (Italian bee)\n\nस्तंभ II (वैज्ञानिक नाम)\nA. एपिस मेलिफेरा (Apis mellifera)\nB. एपिस सेराना इंडिका (Apis cerana indica)\nC. एपिस डोरसेटा (Apis dorsata)\nD. एपिस फ्लोरी (Apis florae)", options: ["1-A, 2-B, 3-C, 4-D", "1-B, 2-C, 3-D, 4-A", "1-D, 2-A, 3-C, 4-B", "1-C, 2-D, 3-B, 4-A"], correct: 1 },
                    { id: 16, text: "Q.16 पुष्पीय पौधों में कायिक प्रवर्धन का निम्नलिखित में से कौन-सा लाभ है?", options: ["ये बीज द्वारा उत्पादित पौधों की तुलना में पहले फूल और फल दे सकते हैं।", "ये अपने मूल पौधों से बिल्कुल भिन्न होते हैं।", "ये बीज द्वारा उत्पादित पौधों की तुलना में बाद में फूल और फल दे सकते हैं।", "ये बीज द्वारा उत्पन्न पौधों की तुलना में पूरी तरह से नए गुण प्रदर्शित कर सकते हैं।"], correct: 0 },
                    { id: 17, text: "Q.17 लोहे के संक्षारण को रोकने के लिए सामान्यतः किस विधि का उपयोग किया जाता है?", options: ["धातु को नियमित रूप से जल से ठंडा करना", "धातु पर पेंट या तेल का विलेपन करना", "धातु का बार-बार तापन करना", "धातु को अम्ल में घोलना"], correct: 1 },
                    { id: 18, text: "Q.18 मेंडल के प्रयोग में, जब उन्होंने एक लंबे (TT) और एक बौने मटर (tt) पौधे का संकरण किया तो F1 पीढ़ी में उन्होंने क्या देखा?", options: ["आधे लंबे थे, आधे बौने थे", "सभी लंबे थे", "सभी मध्यम लंबाई के थे", "सभी बौने थे"], correct: 1 },

                    { id: 63, text: "Q.63 दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष कथन/कथनों का तार्किक रूप से अनुसरण करता/करते है/हैं।\nकथन:\nकुछ बिल्लियाँ, पालतू जानवर हैं।\nसभी पालतू जानवर, पशु हैं।\nनिष्कर्ष:\n(I) कुछ बिल्लियाँ, पशु हैं।\n(II) कोई पशु, पालतू जानवर नहीं है।", options: ["केवल निष्कर्ष (I) अनुसरण करता है", "निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं", "केवल निष्कर्ष (II) अनुसरण करता है", "न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है"], correct: 0 },
                    { id: 64, text: "Q.64 निम्नलिखित संख्या श्रृंखला का संदर्भ लीजिए तथा दिए गए प्रश्न का उत्तर दीजिए। (सभी संख्याएं केवल एकल-अंकीय संख्याएं हैं।)\n(बाएं) 532972454364398333288934576 (दाएं)\nऐसी कितनी विषम संख्याएं हैं, जिनमें से प्रत्येक के ठीक पहले एक विषम संख्या और ठीक बाद एक सम संख्या है?", options: ["9", "8", "7", "6"], correct: 3 },
                    { id: 65, text: "Q.65 दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता/करते हैं।\nकथन:\nकुछ पौधे, सब्ज़ियाँ हैं।\nसभी कलियाँ, सब्ज़ियाँ हैं।\nनिष्कर्ष:\n(I): कुछ पौधे, कलियाँ हैं।\n(II): सभी सब्ज़ियाँ, कलियाँ हैं।", options: ["केवल निष्कर्ष (I) अनुसरण करता है", "निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं", "न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है", "केवल निष्कर्ष (II) अनुसरण करता है"], correct: 2 },
                    { id: 66, text: "Q.66 निम्नलिखित में से कौन-सा अक्षर-संख्या समूह, दी गई श्रृंखला को तार्किक रूप से पूर्ण बनाने के लिए प्रश्न-चिह्न (?) के स्थान पर आएगा?\nDER109, PQD91, BCP73, NOB55, ?", options: ["ZAM37", "ZAN37", "ZEN37", "SAN37"], correct: 1 },

                    { id: 68, text: "Q.68 सात व्यक्ति, A, B, C, D, E, F और G, उत्तर दिशा की ओर अभिमुख एक पंक्ति में बैठे हैं। F के दाईं ओर केवल 2 व्यक्ति बैठे हैं। F और A के बीच केवल 3 व्यक्ति बैठे हैं। E और C दोनों G के निकटतम पड़ोसी हैं। D, B के ठीक बाईं ओर पड़ोस में बैठा है। C, A का निकटतम पड़ोसी नहीं है। D और E के बीच कितने व्यक्ति बैठे हैं?", options: ["3", "2", "4", "1"], correct: 0 },
                    { id: 69, text: "Q.69 एक निश्चित कूट भाषा में,\nA + B का अर्थ है कि 'A, B का पुत्र है',\nA - B का अर्थ है कि 'A, B का भाई है',\nA × B का अर्थ है कि 'A, B की पत्नी है', और\nA ÷ B का अर्थ है कि 'A, B का पिता है'।\nउपरोक्त के आधार पर, यदि 'D × F ÷ G - H + J' है, तो D का J से क्या संबंध है?", options: ["भाई की पुत्री", "पति के भाई की पुत्री", "पति के भाई की पत्नी", "भाई की पत्नी"], correct: 2 },
                    { id: 70, text: "Q.70 अंग्रेजी वर्णमाला क्रम के आधार पर दी गई श्रृंखला में प्रश्न-चिह्न (?) के स्थान पर क्या आना चाहिए?\nPPR MQT JRV GSX ?", options: ["DTT", "ZDR", "KJY", "DTZ"], correct: 3 },

                    { id: 73, text: "Q.73 अंग्रेजी वर्णमाला क्रम के आधार पर, एक निश्चित तरीके से ABCD का संबंध DDJJ से है। उसी तरीके से, MJEB का संबंध PLLH से है। समान तर्क का अनुसरण करते हुए, VPZT का संबंध दिए गए विकल्पों में से किस विकल्प से है?", options: ["YGHJ", "YRGZ", "YREW", "YRTJ"], correct: 1 },
                    { id: 74, text: "Q.74 सात डिब्बे A, B, C, D, I, J और K एक के ऊपर एक रखे गए हैं, लेकिन जरूरी नहीं कि वे इसी क्रम में हों। केवल A को I के ऊपर रखा गया है। I और J के बीच केवल दो डिब्बे रखे गए हैं। केवल K को J के नीचे रखा गया है। D को B के ठीक ऊपर नहीं रखा गया है। B और K के बीच कितने डिब्बे रखे गए हैं?", options: ["चार", "तीन", "एक", "दो"], correct: 3 },

                    { id: 91, text: "Q.91 केंद्रीय बजट 2025-26 के अनुसार, भारत की पांडुलिपि धरोहर के डिजिटलीकरण और संरक्षण हेतु कौन-सा मिशन शुरू किया गया?", options: ["सरस्वती पुरालेख परियोजना", "ज्ञान भारतम मिशन", "कला संपदा मिशन", "ग्रंथ संरक्षण अभियान"], correct: 1 },
                    { id: 92, text: "Q.92 समन्वित ड्रोन झुंडों द्वारा उत्पन्न खतरों को बेअसर करने के लिए अभियंत्रित उस हथियार प्रणाली का नाम क्या है, जिसे मई 2025 में सोलर डिफेंस एंड एयरोस्पेस लिमिटेड (SDAL) द्वारा सफलतापूर्वक विकसित और परीक्षण किया गया था?", options: ["भीमास्त्र (Bheemastra)", "ब्रह्मास्त (Brahmastra)", "शिवास्त्र (Shivastra)", "भार्गवास्त्र (Bhargavastra)"], correct: 3 },
                    { id: 93, text: "Q.93 अप्रैल 2025 में 32 वें एलेट्स विश्व शिक्षा शिखर सम्मेलन (Elets World Education Summit) की मेजबानी किस देश द्वारा की गई?", options: ["यूनाइटेड किंगडम", "दक्षिण अफ्रीका", "संयुक्त अरब अमीरात", "भारत"], correct: 2 },
                    { id: 94, text: "Q.94 फरवरी 2025 में प्रकाशित 'रामसर सूचना पत्रक (Ramsar Information Sheet)' के अनुसार, तमिलनाडु में किस पक्षी अभयारण्य को रामसर स्थल के रूप में नामित किया गया है?", options: ["सक्करकोट्टई पक्षी अभयारण्य", "ओखला पक्षी अभयारण्य", "मंजीरा पक्षी अभयारण्य", "कोल्लेरू पक्षी अभयारण्य"], correct: 0 },
                    { id: 95, text: "Q.95 जून 2025 में, बेंगलुरु के किस स्टेडियम के पास भगदड़ मची थी?", options: ["एम.ए. चिदंबरम स्टेडियम", "एम. चिन्नास्वामी स्टेडियम", "बाराबती स्टेडियम", "राजीव गांधी अंतर्राष्ट्रीय स्टेडियम"], correct: 1 },
                    { id: 96, text: "Q.96 ऑस्ट्रेलियन ओपन 2025 में विमेंस सिंगल्स (Women's Singles) का खिताब किसने जीता?", options: ["कोको गॉफ़ (Coco Gauff)", "मैडिसन कीज़ (Madison Keys)", "इगा स्वियाटेक (Iga Swiatek)", "आर्यना सबालेंका (Aryna Sabalenka)"], correct: 3 },
                    { id: 97, text: "Q.97 सितंबर 2025 में, किस क्षेत्र ने सुरक्षा बढ़ाने के लिए प्रत्येक जिले में एक समर्पित महिला पुलिस स्टेशन स्थापित करने की योजना बनाई है?", options: ["उत्तर प्रदेश का प्रत्येक जिला", "दिल्ली के 15 जिलों में से प्रत्येक", "पश्चिम बंगाल के सभी जिले", "मुंबई उपनगरीय जिला"], correct: 1 },
                    { id: 98, text: "Q.98 जुलाई 2025 में, भारत के निम्नलिखित में से किस राज्य ने मच्छरों की आबादी को अधिक कुशलतापूर्वक और सुरक्षित रूप से ट्रैक एवं नियंत्रित करने के लिए स्मार्ट मॉसक्विटो सर्विलांस सिस्टम (\"SMOSS\") लांच की?", options: ["आंध्र प्रदेश", "झारखंड", "गुजरात", "पंजाब"], correct: 0 },
                    { id: 99, text: "Q.99 24 मई 2025 को नई दिल्ली में नीति (NITI) आयोग की 10वीं गवर्निंग काउंसिल बैठक की अध्यक्षता किसने की?", options: ["श्री राजनाथ सिंह", "श्री नरेंद्र मोदी", "श्रीमती निर्मला सीतारमण", "श्री अमित शाह"], correct: 1 },
                    { id: 100, text: "Q.100 कर्नाटक संशोधन विधेयक, 2025 में किस प्रथा के लिए, वास्तविक बाल विवाह होने से पहले ही, दंड का प्रस्ताव किया गया है?", options: ["नाबालिग की सगाई (Minor engagement)", "नाबालिग प्रवास (Minor migration)", "नाबालिग को गोद लेना (Minor adoption)", "नाबालिग श्रम (Minor labour)"], correct: 0 }
                ]
            }
        };

        let currentSubject = 'science';
        let currentQIndex = 0;

        let userAnswers = {};
        let qStatus = {};

        for (let sub in examData) {
            userAnswers[sub] = new Array(examData[sub].questions.length).fill(null);
            qStatus[sub] = new Array(examData[sub].questions.length).fill('not-visited');
        }

        // Timer Logic
        let totalSeconds = 90 * 60;
        const timerDisplay = document.getElementById('timer-display');

        const timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.innerText = `${minutes}:${seconds}`;

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Time Over! Test automatically submit ho raha hai.");
                submitTest();
            }
            totalSeconds--;
        }, 1000);

        function switchSubject(subKey, evt) {
            currentSubject = subKey;
            currentQIndex = 0;

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }

            document.getElementById('subject-title').innerText = examData[subKey].name;
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const qList = examData[currentSubject].questions;
            const q = qList[index];

            if (qStatus[currentSubject][index] === 'not-visited') {
                qStatus[currentSubject][index] = 'not-answered';
            }

            document.getElementById('question-number').innerText = `Question No. ${q.id}`;
            document.getElementById('question-text').innerText = q.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, optIdx) => {
                const isChecked = userAnswers[currentSubject][index] === optIdx;
                const label = document.createElement('label');
                if (isChecked) {
                    label.classList.add('selected-option');
                }
                
                label.innerHTML = `
                    <input type="radio" name="opt" value="${optIdx}" ${isChecked ? 'checked' : ''}>
                    <span>${opt}</span>
                `;
                
                label.addEventListener('click', function () {
                    document.querySelectorAll('.options-container label').forEach(l => l.classList.remove('selected-option'));
                    this.classList.add('selected-option');
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                    }
                    
                    userAnswers[currentSubject][currentQIndex] = optIdx;
                    qStatus[currentSubject][currentQIndex] = 'answered';
                    updatePaletteUI();
                });

                container.appendChild(label);
            });

            updatePaletteUI();
        }

        function saveAndNext() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
                qStatus[currentSubject][currentQIndex] = 'answered'; // GREEN
            } else {
                if (qStatus[currentSubject][currentQIndex] !== 'review') {
                    qStatus[currentSubject][currentQIndex] = 'not-answered'; // RED
                }
            }

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
                alert(`Aap ${examData[currentSubject].name} section ke aakhri question par hain!`);
            }
        }

        function clearOption() {
            userAnswers[currentSubject][currentQIndex] = null;
            qStatus[currentSubject][currentQIndex] = 'not-answered'; // RED
            loadQuestion(currentQIndex);
        }

        function markForReview() {
            const selectedOpt = document.querySelector('input[name="opt"]:checked');
            if (selectedOpt) {
                userAnswers[currentSubject][currentQIndex] = parseInt(selectedOpt.value);
            }
            qStatus[currentSubject][currentQIndex] = 'review'; // PURPLE

            const qList = examData[currentSubject].questions;
            if (currentQIndex < qList.length - 1) {
                loadQuestion(currentQIndex + 1);
            } else {
                updatePaletteUI();
            }
        }

        function updatePaletteUI() {
            const paletteGrid = document.getElementById('question-palette');
            paletteGrid.innerHTML = '';

            const qList = examData[currentSubject].questions;
            let countAnswered = 0, countNotAnswered = 0, countNotVisited = 0, countReview = 0;

            qList.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${idx === currentQIndex ? 'active' : ''}`;
                btn.innerText = q.id;

                const status = qStatus[currentSubject][idx];
                if (status === 'answered') {
                    btn.classList.add('status-answered');
                    countAnswered++;
                } else if (status === 'not-answered') {
                    btn.classList.add('status-not-answered');
                    countNotAnswered++;
                } else if (status === 'review') {
                    btn.classList.add('status-review');
                    countReview++;
                } else {
                    btn.classList.add('status-not-visited');
                    countNotVisited++;
                }

                btn.onclick = () => loadQuestion(idx);
                paletteGrid.appendChild(btn);
            });

            document.getElementById('count-answered').innerText = countAnswered;
            document.getElementById('count-not-answered').innerText = countNotAnswered;
            document.getElementById('count-not-visited').innerText = countNotVisited;
            document.getElementById('count-review').innerText = countReview;
        }

        function submitTest() {
            clearInterval(timerInterval);

            let totalMarks = 0;
            let totalCorrect = 0;
            let totalWrong = 0;

            for (let sub in examData) {
                const qList = examData[sub].questions;
                qList.forEach((q, idx) => {
                    const ans = userAnswers[sub][idx];
                    if (ans !== null) {
                        if (ans === q.correct) {
                            totalMarks += 1;
                            totalCorrect++;
                        } else {
                            totalMarks -= 0.33;
                            totalWrong++;
                        }
                    }
                });
            }

            alert(`--- FINAL RESULT SUMMARY ---
Total Correct: ${totalCorrect}
Total Wrong: ${totalWrong}
Final Score: ${totalMarks.toFixed(2)} Marks`);
        }

        loadQuestion(0);
    </script>
